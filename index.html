<!DOCTYPE html>
<html lang="es">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F7F5;--surface:#FFFFFF;--border:#E5E5E2;--border-light:#EFEFEC;--text:#1A1A18;--text2:#5F5E5A;--text3:#9B9A96;--blue:#378ADD;--blue-bg:#E6F1FB;--blue-dark:#0C447C;--green-bg:#EAF3DE;--green:#3B6D11;--green-border:#639922;--orange-bg:#FAEEDA;--orange:#633806;--orange-border:#EF9F27;--red-bg:#FCEBEB;--red:#791F1F;--red-border:#F09595;--yellow-bg:#FEF3E2;--yellow:#7A4A00;--radius:6px;--radius-lg:10px;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;height:48px}
.nav-logo{font-size:15px;font-weight:600;margin-right:20px;display:flex;align-items:center;gap:6px}
.nav-logo span{color:var(--blue)}
.nav-tab{display:flex;align-items:center;gap:5px;padding:0 14px;height:48px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.nav-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.nav-date{margin-left:auto;font-size:12px;color:var(--text3)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 48px);padding:2rem}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;width:100%;max-width:380px}
.login-title{font-size:16px;font-weight:600;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:1.5rem}
.login-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;margin-bottom:8px}
.login-opt:hover{border-color:var(--blue);background:var(--blue-bg)}
.login-opt i{font-size:22px;color:var(--blue)}
.login-opt strong{font-size:13px;display:block}
.login-opt span{font-size:11px;color:var(--text3)}
.m-hdr{display:flex;align-items:center;gap:10px;padding:.9rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.m-hdr-title{font-size:15px;font-weight:500}
.history-badge{font-size:11px;padding:2px 8px;border-radius:var(--radius);background:var(--yellow-bg);color:var(--yellow);font-weight:500}
.toolbar{display:flex;align-items:center;gap:10px;padding:.65rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;position:relative}
.toolbar label{font-size:13px;color:var(--text2)}
.dd-wrap{position:relative}
.dd-btn{font-size:13px;height:30px;padding:0 28px 0 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;min-width:140px;text-align:left;position:relative}
.dd-btn::after{content:'';position:absolute;right:10px;top:50%;transform:translateY(-50%);border:4px solid transparent;border-top-color:var(--text3);margin-top:2px}
.dd-menu{display:none;position:absolute;top:34px;left:0;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-width:200px;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.08);max-height:320px;overflow-y:auto}
.dd-menu.open{display:block}
.dd-item{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none}
.dd-item:hover{background:var(--bg)}
.dd-item input[type=checkbox]{width:14px;height:14px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.dd-item.sub{padding-left:28px;font-size:12px;color:var(--text2)}
.dd-divider{border:none;border-top:1px solid var(--border-light);margin:3px 0}
.dd-group-label{padding:6px 12px 2px;font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.list{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:8px}
.group-sector-title{font-size:15px;font-weight:500;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px}
.group-jur-title{font-size:11px;font-weight:500;color:var(--blue);letter-spacing:.04em;text-transform:uppercase;padding:6px 0 4px;margin-top:4px}
.group-jur-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.card{border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;background:var(--surface);cursor:pointer}
.card.sel{border:1.5px solid var(--blue);background:var(--blue-bg)}
.card.sel .ctitle{color:var(--blue-dark)}
.card-row{display:flex;gap:10px;align-items:flex-start}
.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.card.sel .chk{background:var(--blue);border-color:var(--blue)}
.cinfo{flex:1;min-width:0}
.ctitle{font-size:13px;font-weight:500;margin-bottom:5px;line-height:1.4}
.cmeta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.pill{font-size:11px;padding:2px 7px;border-radius:var(--radius);font-weight:500}
.p-num{background:var(--blue-bg);color:var(--blue-dark)}
.p-org{background:#F1EFE8;color:#5F5E5A}
.p-fecha{background:var(--bg);color:var(--text2);font-weight:400}
.p-tema{background:var(--yellow-bg);color:var(--yellow)}
.cresumen{font-size:12px;color:var(--text2);line-height:1.5}
.impacts-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light)}
.impacts-title{font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:500}
.impacts-grid{display:flex;flex-wrap:wrap;gap:6px}
.imp-item{display:flex;align-items:center;gap:4px}
.imp-label{font-size:11px;color:var(--text2);white-space:nowrap}
.imp-select{font-size:11px;height:24px;padding:0 4px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg)}
.imp-select.alto{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.imp-select.medio{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border)}
.imp-select.bajo{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.footer{padding:1rem 1.25rem;border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0}
.footer-top{display:flex;align-items:center;justify-content:space-between}
.footer-info{font-size:13px;color:var(--text2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-top:10px}
.alert.success{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.alert.error{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}
.alert.info{background:var(--blue-bg);border:1px solid var(--blue);color:var(--blue-dark)}
.admin-body{padding:1.5rem;max-width:960px;margin:0 auto}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.25rem}
.admin-card-title{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.admin-card-sub{font-size:12px;color:var(--text3);margin-bottom:1rem}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field-grid.full{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:500;color:var(--text2)}
.field input,.field select,.field textarea{font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.pi-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);font-size:13px;margin-bottom:8px}
.pi-num{background:var(--blue-bg);color:var(--blue-dark);font-size:11px;padding:2px 7px;border-radius:var(--radius);font-weight:500;white-space:nowrap}
.pi-title{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-jur{font-size:11px;color:var(--text3);white-space:nowrap}
.pi-del{padding:4px 8px;font-size:12px;border-radius:var(--radius);border:1px solid var(--red-border);background:var(--red-bg);color:var(--red);cursor:pointer}
.eml-drop{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:2rem;text-align:center;cursor:pointer;background:var(--bg)}
.eml-drop:hover{border-color:var(--blue);background:var(--blue-bg)}
.eml-input{display:none}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center}
.overlay.show{display:flex}
.overlay-box{background:var(--surface);border-radius:var(--radius-lg);padding:2rem;text-align:center;max-width:320px}
.spin{font-size:36px;color:var(--blue);display:block;margin-bottom:12px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mgr-card{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:12px}
.mgr-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.mgr-name{font-size:13px;font-weight:600;flex:1}
.mgr-count{font-size:11px;color:var(--text3)}
.mgr-clear{padding:3px 8px;font-size:11px;border-radius:var(--radius);border:1px solid var(--red-border);background:var(--red-bg);color:var(--red);cursor:pointer}
.mgr-projs{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.mgr-proj{display:flex;align-items:center;gap:8px;font-size:12px}
.mgr-pnum{background:var(--blue-bg);color:var(--blue-dark);font-size:11px;padding:2px 6px;border-radius:var(--radius);font-weight:500;white-space:nowrap}
.mgr-ptitle{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr-imps{display:flex;gap:4px;flex-wrap:wrap}
.mgr-imp{font-size:10px;padding:1px 5px;border-radius:var(--radius)}
.mgr-imp.alto{background:var(--green-bg);color:var(--green)}
.mgr-imp.medio{background:var(--orange-bg);color:var(--orange)}
.mgr-imp.bajo{background:var(--red-bg);color:var(--red)}
.empty{text-align:center;padding:3rem;color:var(--text3);font-size:13px}
.cprev{background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);padding:8px 12px;font-size:11px;font-family:monospace;color:var(--text2);white-space:pre;overflow-x:auto;line-height:1.8;max-height:200px;overflow-y:auto;margin-top:10px}
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="overlay-box"><i class="ti ti-loader-2 spin"></i><p id="overlay-msg">Cargando...</p><small id="overlay-sub"></small></div>
</div>
<nav class="nav">
  <div class="nav-logo"><i class="ti ti-news" style="color:var(--blue)"></i> Snippet <span>Digital</span></div>
  <div id="nav-tabs"></div>
  <div class="nav-date" id="nav-date"></div>
</nav>
<div id="app"></div>
<script>
var SB_URL = 'https://xyqmtqsczscdejcwusce.supabase.co';
var SB_KEY = 'sb_publishable_LHaQlBOrhJ5CRyISMiuXhg_0s6Unaxf';

async function sbFetch(path, method, body) {
  var opts = {method: method||'GET', headers: {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'}};
  if (body) opts.body = JSON.stringify(body);
  var r = await fetch(SB_URL+'/rest/v1/'+path, opts);
  var t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function dbGetAllProjects() {
  try {
    var r = await sbFetch('projects?select=date,data&order=date.desc');
    var all = [];
    (r||[]).forEach(function(row){ (row.data||[]).forEach(function(p){ all.push(p); }); });
    // Sort by fecha desc
    all.sort(function(a,b){
      var da = a.fecha ? a.fecha.split('/').reverse().join('') : '';
      var db = b.fecha ? b.fecha.split('/').reverse().join('') : '';
      return db.localeCompare(da);
    });
    return all;
  } catch(e) { return []; }
}

async function dbGetAllSelections() {
  try {
    var r = await sbFetch('selections?select=manager,data');
    var out = {};
    (r||[]).forEach(function(x){
      if (!out[x.manager]) out[x.manager] = {};
      Object.assign(out[x.manager], x.data);
    });
    return out;
  } catch(e) { return {}; }
}


async function dbSaveProjects(d, ps) { try { await sbFetch('projects?date=eq.'+d,'DELETE'); } catch(e) {} if (ps.length) try { await sbFetch('projects','POST',{id:Date.now(),date:d,data:ps}); } catch(e) {} }
async function dbGetSelections(d) { try { var r = await sbFetch('selections?date=eq.'+d+'&select=manager,data'); var o = {}; (r||[]).forEach(function(x){o[x.manager]=x.data;}); return o; } catch(e) { return {}; } }
async function dbSaveSelection(d, m, data) { try { await sbFetch('selections?date=eq.'+d+'&manager=eq.'+encodeURIComponent(m),'DELETE'); } catch(e) {} try { await sbFetch('selections','POST',{date:d,manager:m,data:data,updated_at:new Date().toISOString()}); } catch(e) {} }

var SECTORES = ['Coyuntura general','Consumo masivo','Medios de pago','Tecnologia','Automotriz','Agroindustria','Petroquimicos','Mineria','Turismo','Salud','Ambiente'];
var PROVINCIAS = ['CABA','Buenos Aires','Catamarca','Chaco','Chubut','Cordoba','Corrientes','Entre Rios','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquen','Rio Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego','Tucuman'];
var JUR_ORDER = ['Nacional'].concat(PROVINCIAS).concat(['Municipal']);
var CLIENTS = ['Amazon (sector)','Amazon (grado)','AMEX','Coca','Kenvue','Spotify','AWS','TikTok','Roblox','Syngenta','Syngenta pos/neg/neutro','Airbnb','World','Tetrapak','Sanofi','Rio Tinto'];
var IMPACT = ['-','Alto','Medio','Bajo','N/A'];
var MANAGERS = ['Camila (admin)','Carolina','Chiara','Hernan','Felicitas','Erika','Ana','Agustina','Milagros'];
var TEMAS = [{tema:'Datos personales',keys:['dato personal','privacidad']},{tema:'Inteligencia artificial',keys:['inteligencia artificial','algoritm']},{tema:'Grooming',keys:['grooming']},{tema:'Plataformas digitales',keys:['plataforma digital']},{tema:'Derechos laborales',keys:['laboral','trabajador']},{tema:'Redes Sociales',keys:['red social','redes sociales']},{tema:'Educacion',keys:['educati','escolar','escuela']},{tema:'Impuestos',keys:['fiscal','tributari','impuesto']},{tema:'Ambiental',keys:['ambiental','residuo']},{tema:'Medicamentos',keys:['medicamento','farmaco']},{tema:'Biocombustibles',keys:['biocombustible','hidrocarburo']},{tema:'Litio',keys:['litio']},{tema:'Semillas',keys:['semilla']},{tema:'Turismo',keys:['turismo']},{tema:'Lobby',keys:['lobby','cabildeo']},{tema:'Salud mental',keys:['suicida','salud mental']},{tema:'Restricciones comerciales',keys:['exportacion','arancel']}];

var PROJECTS = [], SELS = {}, currentUser = null, viewDate = '', localSel = {}, localImp = {};

function isoToday() { return new Date().toISOString().slice(0,10); }
function isoToDisplay(iso) { if (!iso) return ''; var p = iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function todayStr() { return new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function showOverlay(msg, sub) { document.getElementById('overlay').classList.add('show'); document.getElementById('overlay-msg').textContent = msg; document.getElementById('overlay-sub').textContent = sub||''; }
function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }

function mapTema(title, resumen) {
  var txt = (title+' '+resumen).toLowerCase();
  for (var i = 0; i < TEMAS.length; i++) { for (var j = 0; j < TEMAS[i].keys.length; j++) { if (txt.indexOf(TEMAS[i].keys[j]) >= 0) return TEMAS[i].tema; } }
  return 'Otro';
}
function mapOrg(org) {
  var l = (org||'').toLowerCase();
  if (l.indexOf('diputados') >= 0 && l.indexOf('naci') >= 0) return 'Camara de Diputados Nacional';
  if ((l.indexOf('senadores') >= 0 || l.indexOf('senado') >= 0) && l.indexOf('naci') >= 0) return 'Camara de Senadores Nacional';
  if (l.indexOf('legislatura') >= 0) return 'Legislatura Provincial';
  if (l.indexOf('diputados') >= 0) return 'Camara de Diputados Provincial';
  return org||'';
}

function buildNav() {
  var tabs = document.getElementById('nav-tabs');
  if (!currentUser) { tabs.innerHTML = ''; return; }
  var isAdmin = currentUser === 'Camila (admin)';
  var h = '<div class="nav-tab active" id="tab-mgr" onclick="switchTab(\'mgr\')"><i class="ti ti-layout-list"></i> Seleccion</div>';
  if (isAdmin) {
    h += '<div class="nav-tab" id="tab-consolidado" onclick="switchTab(\'consolidado\')"><i class="ti ti-table"></i> Consolidado</div>';
    h += '<div class="nav-tab" id="tab-adm" onclick="switchTab(\'adm\')"><i class="ti ti-settings"></i> Cargar proyectos</div>';
  }
  h += '<div style="margin-left:8px;display:flex;align-items:center;gap:6px;padding:0 8px;border-left:1px solid var(--border)">';
  h += '<span style="font-size:12px;color:var(--text2)">'+currentUser+'</span>';
  h += '<button style="font-size:11px;padding:3px 8px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer" onclick="logout()">Salir</button></div>';
  tabs.innerHTML = h;
}

function switchTab(t) { document.querySelectorAll('.nav-tab').forEach(function(el){el.classList.remove('active');}); var el = document.getElementById('tab-'+t); if (el) el.classList.add('active'); renderApp(t); }

function renderLogin() {
  var h = '<div class="login-wrap"><div class="login-card"><div class="login-title">Bienvenido a Snippet Digital</div><div class="login-sub">Selecciona tu nombre para continuar</div>';
  MANAGERS.forEach(function(m) {
    h += '<div class="login-opt" onclick="login(\''+m+'\')"><i class="ti '+(m==='Camila (admin)'?'ti-shield-check':'ti-user')+'"></i>';
    h += '<div><strong>'+m+'</strong><span>'+(m==='Camila (admin)'?'Administrador - Acceso completo':'Manager - Seleccion de proyectos')+'</span></div></div>';
  });
  h += '</div></div>';
  document.getElementById('app').innerHTML = h;
}

async function login(name) {
  currentUser = name; viewDate = isoToday(); localSel = {}; localImp = {};
  showOverlay('Cargando proyectos...');
  PROJECTS = await dbGetAllProjects();
  SELS = await dbGetAllSelections();
  if (SELS[currentUser]) { Object.keys(SELS[currentUser]).forEach(function(pid){ localSel[pid]=true; localImp[pid]=SELS[currentUser][pid].impacts||{}; }); }
  hideOverlay(); buildNav(); renderApp('mgr');
}
function logout() { currentUser=null; localSel={}; localImp={}; PROJECTS=[]; SELS={}; buildNav(); renderLogin(); }
function renderApp(tab) { var app=document.getElementById('app'); if(tab==='mgr')renderManager(app); else if(tab==='consolidado')renderConsolidado(app); else if(tab==='adm')renderAdmin(app); }

function renderManager(container) {
  var h = '<div class="m-hdr">';
  h += '<i class="ti ti-file-text" style="font-size:20px;color:var(--text2)"></i>';
  h += '<span class="m-hdr-title">Proyectos</span>';
  h += '</div>';
  h += '<div class="toolbar"><label>Sector</label><div class="dd-wrap"><button class="dd-btn" id="dd-sec-btn" onclick="toggleMenu(\'sec\',event)">Todos</button>';
  h += '<div class="dd-menu" id="dd-sec-menu"><div class="dd-item" onclick="toggleAllSec(event)"><input type="checkbox" id="chk-all-sec" checked> Todos</div><hr class="dd-divider"><div id="sec-items"></div></div></div>';
  h += '<label>Jurisdiccion</label><div class="dd-wrap"><button class="dd-btn" id="dd-jur-btn" onclick="toggleMenu(\'jur\',event)">Todas</button>';
  h += '<div class="dd-menu" id="dd-jur-menu"><div class="dd-item" onclick="toggleAllJur(event)"><input type="checkbox" id="chk-all-jur" checked> Todas</div><hr class="dd-divider">';
  h += '<div class="dd-item" onclick="toggleJur(\'Nacional\',event)"><input type="checkbox" class="jur-chk" value="Nacional" checked> Nacional</div><hr class="dd-divider">';
  h += '<div class="dd-group-label">Provincial</div><div class="dd-item" onclick="toggleAllProv(event)"><input type="checkbox" id="chk-all-prov" checked> Todas las provincias</div>';
  h += '<div id="prov-items"></div><hr class="dd-divider"><div class="dd-group-label">Municipal</div>';
  h += '<div class="dd-item" onclick="toggleJur(\'Municipal\',event)"><input type="checkbox" class="jur-chk" value="Municipal" checked> Municipal</div></div></div></div>';
  h += '<div class="list" id="list"></div>';
  h += '<div class="footer"><div id="submit-status"></div><div class="footer-top"><span class="footer-info" id="finfo">Selecciona proyectos para enviar</span>';
  h += '<button class="btn primary" onclick="submitSelection()"><i class="ti ti-send"></i> Enviar seleccion</button></div></div>';
  container.innerHTML = h;
  buildFilters(); renderList();
}

function buildFilters() {
  var si = document.getElementById('sec-items');

function initImp(id) { if (!localImp[id]) { localImp[id]={}; CLIENTS.forEach(function(c){localImp[id][c]='-';}); } }

function getOtherImpacts(pid) {
  // Returns [{name, client, level}] from other managers who already submitted
  var results = [];
  Object.keys(SELS).forEach(function(mname) {
    if (mname === currentUser) return;
    var sel = SELS[mname];
    if (!sel[pid]) return;
    var imp = sel[pid].impacts || {};
    CLIENTS.forEach(function(c) {
      if (imp[c] && imp[c] !== '-') {
        results.push({name: mname, client: c, level: imp[c]});
      }
    });
  });
  return results;
}

function impactBadgeStyle(level) {
  if (level === 'Alto') return 'background:#C0392B;color:#fff;';
  if (level === 'Medio') return 'background:#E67E22;color:#fff;';
  if (level === 'Bajo') return 'background:#F9E4A0;color:#7A5C00;';
  return 'background:#eee;color:#555;';
}

function cardHTML(p) {
  var isSel = !!localSel[p.id];
  if (isSel) initImp(p.id);
  var tema = mapTema(p.title, p.resumen);
  var rf = 'El proyecto de ley tiene por objeto '+p.resumen;
  var rs = isSel ? rf : (rf.length>160 ? rf.substring(0,160)+'...' : rf);
  var otherImps = getOtherImpacts(p.id);

  var h = '<div class="card'+(isSel?' sel':'')+'" onclick="toggleCard('+p.id+',event)" style="display:flex;gap:10px;padding:12px 14px">';

  // Left: main content
  h += '<div style="flex:1;min-width:0">';
  h += '<div class="card-row" style="gap:10px">';
  h += '<div class="chk">'+(isSel?'<i class="ti ti-check" style="font-size:12px;color:#fff"></i>':'')+'</div>';
  h += '<div class="cinfo"><div class="ctitle">'+p.title+'</div>';
  h += '<div class="cmeta"><span class="pill p-fecha"><i class="ti ti-calendar" style="font-size:10px"></i> '+p.fecha+'</span>';
  h += '<span class="pill p-num">'+p.num+'</span><span class="pill p-tema">'+tema+'</span>';
  h += '<span class="pill p-org">'+mapOrg(p.org)+'</span>';
  if (p.linkExpediente) h += '<a href="'+p.linkExpediente+'" target="_blank" onclick="event.stopPropagation()" style="font-size:11px;color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:3px"><i class="ti ti-link" style="font-size:11px"></i> Expediente</a>';
  if (p.linkTexto) h += '<a href="'+p.linkTexto+'" target="_blank" onclick="event.stopPropagation()" style="font-size:11px;color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:3px"><i class="ti ti-file-text" style="font-size:11px"></i> Texto</a>';
  h += '</div><div class="cresumen">'+rs+'</div>';
  h += (isSel ? renderImp(p.id) : '');
  h += '</div></div></div>';

  // Right: other managers' impacts
  if (otherImps.length) {
    h += '<div onclick="event.stopPropagation()" style="min-width:130px;max-width:160px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--border-light);padding-left:10px;flex-shrink:0">';
    h += '<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Impactos</div>';
    otherImps.forEach(function(x) {
      h += '<div style="display:flex;align-items:center;gap:5px">';
      h += '<span style="font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;'+impactBadgeStyle(x.level)+'">'+x.level+'</span>';
      h += '<span style="font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px" title="'+x.name+' - '+x.client+'">'+x.name.split(' ')[0]+' · '+x.client+'</span>';
      h += '</div>';
    });
    h += '</div>';
  }

  h += '</div>';
  return h;
}

function renderImp(pid) {
  initImp(pid);
  var imp = localImp[pid];
  var h = '<div class="impacts-section" onclick="event.stopPropagation()"><div class="impacts-title">Impacto por cliente</div><div class="impacts-grid">';
  CLIENTS.forEach(function(c) {
    var v = imp[c]||'-'; var cls = v==='Alto'?'alto':v==='Medio'?'medio':v==='Bajo'?'bajo':'';
    h += '<div class="imp-item"><span class="imp-label">'+c+'</span><select class="imp-select '+cls+'" onchange="setImp('+pid+',\''+c+'\',this.value);colorSel(this)">';
    IMPACT.forEach(function(o){ h += '<option'+(v===o?' selected':'')+'>'+o+'</option>'; });
    h += '</select></div>';
  });
  h += '</div></div>'; return h;
}

function colorSel(el) { el.className = 'imp-select '+(el.value==='Alto'?'alto':el.value==='Medio'?'medio':el.value==='Bajo'?'bajo':''); }
function setImp(pid,client,val) { initImp(pid); localImp[pid][client]=val; }

function renderList() {
  var aS=getActiveSectors(),aJ=getActiveJurs();
  var f = PROJECTS.filter(function(p){return aS.indexOf(p.sector)>=0&&aJ.indexOf(p.jur)>=0;});
  var list = document.getElementById('list'); if (!list) return;
  if (!PROJECTS.length) { list.innerHTML='<div class="empty"><i class="ti ti-inbox" style="font-size:28px;display:block;margin:0 auto 10px"></i>No hay proyectos cargados.</div>'; return; }
  if (!f.length) { list.innerHTML='<div class="empty"><i class="ti ti-filter-off" style="font-size:28px;display:block;margin:0 auto 10px"></i>No hay proyectos con esos filtros</div>'; return; }

  // Group by fecha
  var groups = {};
  var groupOrder = [];
  f.forEach(function(p) {
    var fecha = p.fecha || 'Sin fecha';
    if (!groups[fecha]) { groups[fecha] = []; groupOrder.push(fecha); }
    groups[fecha].push(p);
  });
  // Sort dates desc (already sorted but enforce)
  groupOrder.sort(function(a,b){
    var da = a !== 'Sin fecha' ? a.split('/').reverse().join('') : '';
    var db = b !== 'Sin fecha' ? b.split('/').reverse().join('') : '';
    return db.localeCompare(da);
  });

  var DIAS = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  var DIAS_ES = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function fechaLabel(fecha) {
    if (fecha === 'Sin fecha') return 'Sin fecha';
    var parts = fecha.split('/');
    if (parts.length !== 3) return fecha;
    var d = parseInt(parts[0]), m = parseInt(parts[1])-1, y = parseInt(parts[2]);
    var date = new Date(y, m, d);
    var diaNom = DIAS_ES[date.getDay()];
    var mesNom = MESES[m];
    // Check if today or yesterday
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.round((today - date) / 86400000);
    var extra = diff === 0 ? ' — Hoy' : diff === 1 ? ' — Ayer' : '';
    return diaNom + ' ' + d + ' de ' + mesNom + ' de ' + y + extra;
  }

  var h = '';
  groupOrder.forEach(function(fecha) {
    var ps = groups[fecha];
    h += '<div style="margin-bottom:1.5rem">';
    h += '<div style="font-size:14px;font-weight:600;color:var(--text);padding:10px 0 8px;border-bottom:2px solid var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:8px">';
    h += '<i class="ti ti-calendar" style="color:var(--blue);font-size:16px"></i>';
    h += fechaLabel(fecha);
    h += '<span style="font-size:11px;font-weight:400;color:var(--text3);margin-left:4px">('+ps.length+' proyecto'+(ps.length!==1?'s':'')+')</span>';
    h += '</div>';
    if (allSecSelected()) {
      SECTORES.forEach(function(sec) {
        var sp = ps.filter(function(p){return p.sector===sec;}); if (!sp.length) return;
        h += '<div class="group-sector-title" style="margin-top:8px">'+sec+'</div>';
        JUR_ORDER.forEach(function(jur){ var jp=sp.filter(function(p){return p.jur===jur;}); if(!jp.length)return; h+='<div class="group-jur-title">'+jur+'</div><div class="group-jur-cards">'+jp.map(cardHTML).join('')+'</div>'; });
      });
    } else {
      h += ps.map(cardHTML).join('');
    }
    h += '</div>';
  });
  list.innerHTML = h;
}

function toggleCard(id,e) { if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return; if(localSel[id]){delete localSel[id];delete localImp[id];}else{localSel[id]=true;initImp(id);} renderList(); updateFinfo(); }

async function submitSelection() {
  var n=Object.keys(localSel).length; var s=document.getElementById('submit-status');
  if(!n){if(s)s.innerHTML='<div class="alert info">Selecciona al menos un proyecto.</div>';return;}
  showOverlay('Guardando seleccion...');
  var sd={}; Object.keys(localSel).forEach(function(pid){sd[pid]={impacts:localImp[pid]||{},ts:Date.now()};});
  try { await dbSaveSelection(viewDate,currentUser,sd); SELS[currentUser]=sd; hideOverlay(); if(s)s.innerHTML='<div class="alert success"><i class="ti ti-check"></i> Seleccion enviada - '+n+' proyecto(s) guardados.</div>'; }
  catch(e) { hideOverlay(); if(s)s.innerHTML='<div class="alert error">Error: '+e.message+'</div>'; }
}

function managerCard(name,sel,projects) {
  var pids=Object.keys(sel).map(Number); var ps=projects.filter(function(p){return pids.indexOf(p.id)>=0;});
  var h='<div class="mgr-card"><div class="mgr-hdr"><i class="ti ti-user" style="color:var(--blue);font-size:16px"></i>';
  h+='<span class="mgr-name">'+name+'</span><span class="mgr-count">'+ps.length+' proyecto(s)</span>';
  h+='<button class="mgr-clear" onclick="clearMgrSel(\''+name+'\')"><i class="ti ti-trash"></i></button></div><div class="mgr-projs">';
  ps.forEach(function(p){ var imp=(sel[p.id]&&sel[p.id].impacts)||{}; var nd=Object.entries(imp).filter(function(x){return x[1]&&x[1]!=='-';}); h+='<div class="mgr-proj"><span class="mgr-pnum">'+p.num+'</span><span class="mgr-ptitle">'+p.title+'</span><div class="mgr-imps">'+nd.map(function(x){return'<span class="mgr-imp '+x[1].toLowerCase()+'">'+x[0]+': '+x[1]+'</span>';}).join('')+'</div></div>'; });
  h+='</div></div>'; return h;
}

async function clearMgrSel(name) {
  if(!confirm('Eliminar la seleccion de '+name+'?'))return;
  showOverlay('Eliminando...');
  try{await sbFetch('selections?date=eq.'+viewDate+'&manager=eq.'+encodeURIComponent(name),'DELETE');delete SELS[name];}catch(e){}
  hideOverlay(); renderConsolidado(document.getElementById('app'));
}

function mergeImpacts(pids,sels) {
  var order={'-':0,'N/A':1,'Bajo':2,'Medio':3,'Alto':4}; var merged={};
  pids.forEach(function(pid){ merged[pid]={}; CLIENTS.forEach(function(c){ var best='-'; Object.values(sels).forEach(function(sel){var v=(sel[pid]&&sel[pid].impacts&&sel[pid].impacts[c])||'-';if((order[v]||0)>(order[best]||0))best=v;}); merged[pid][c]=best; }); });
  return merged;
}

function buildRows(projects,sels) {
  var hoy=todayStr(); var merged=mergeImpacts(projects.map(function(p){return p.id;}),sels);
  return projects.map(function(p){
    var imp=merged[p.id]||{}; var ca=CLIENTS.filter(function(c){return imp[c]&&imp[c]!=='-';}).join(', ')||'';
    var cols=[p.num,p.linkExpediente||'',p.fecha,hoy,'Argentina',p.jur,p.autor||'',p.sector,ca,mapTema(p.title,p.resumen),p.title.toUpperCase(),'El proyecto de ley tiene por objeto '+p.resumen,p.linkTexto||'',mapOrg(p.org),'','','',p.fecha].concat(CLIENTS.map(function(c){return imp[c]||'-';}));
    return cols.join('\t');
  }).join('\n');
}

function copyConsolidado() {
  var allPids=new Set(); Object.values(SELS).forEach(function(sel){Object.keys(sel).forEach(function(pid){allPids.add(parseInt(pid));});});
  var sp=PROJECTS.filter(function(p){return allPids.has(p.id);}); if(!sp.length)return;
  var rows=buildRows(sp,SELS);
  var showOk=function(){var ok=document.getElementById('copy-ok');if(ok){ok.style.display='inline';setTimeout(function(){ok.style.display='none';},2200);}};
  try{navigator.clipboard.writeText(rows).then(showOk).catch(function(){fallbackCopy(rows,showOk);});}catch(e){fallbackCopy(rows,showOk);}
}

function fallbackCopy(text,cb) {
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');if(cb)cb();}catch(e){alert('Copia manual: Ctrl+A, Ctrl+C en el preview');}
  document.body.removeChild(ta);
}

  if(todayProjects.length){todayProjects.forEach(function(p){h+='<div class="pi-row"><span class="pi-num">'+p.num+'</span><span class="pi-title">'+p.title+'</span><span class="pi-jur">'+p.jur+' - '+p.sector+'</span><button class="pi-del" onclick="deleteProject('+p.id+')"><i class="ti ti-trash"></i></button></div>';});}
  else{h+='<div style="font-size:13px;color:var(--text3);padding:8px 0">No hay proyectos cargados hoy.</div>';}
  h+='</div></div></div>'; container.innerHTML=h;
}

async function addProject() {
  var num=document.getElementById('f-num').value.trim(),fechaRaw=document.getElementById('f-fecha').value||isoToday(),sector=document.getElementById('f-sector').value,jur=document.getElementById('f-jur').value,org=document.getElementById('f-org').value.trim(),autor=document.getElementById('f-autor').value.trim(),title=document.getElementById('f-title').value.trim(),resumen=document.getElementById('f-resumen').value.trim(),linkExpediente=document.getElementById('f-link-exp').value.trim(),linkTexto=document.getElementById('f-link-pdf').value.trim();
  var errs=[]; if(!num)errs.push('Numero');if(!sector)errs.push('Sector');if(!jur)errs.push('Jurisdiccion');if(!org)errs.push('Organismo');if(!title)errs.push('Titulo');if(!resumen)errs.push('Resumen');
  var alertEl=document.getElementById('form-alert');
  if(errs.length){alertEl.innerHTML='<div class="alert error">Completa: '+errs.join(', ')+'</div>';return;}
  showOverlay('Guardando...');
  var p={id:Date.now(),num:num,sector:sector,jur:jur,org:org,autor:autor,title:title,resumen:resumen,linkExpediente:linkExpediente,linkTexto:linkTexto,fecha:isoToDisplay(fechaRaw)};
  PROJECTS.push(p); await dbSaveProjects(fechaRaw,PROJECTS); hideOverlay();
  alertEl.innerHTML='<div class="alert success"><i class="ti ti-check"></i> Proyecto agregado</div>';
  setTimeout(function(){renderAdmin(document.getElementById('app'));},1200);
}

async function deleteProject(id) { if(!confirm('Eliminar?'))return; showOverlay('Eliminando...'); PROJECTS=PROJECTS.filter(function(p){return p.id!==id;}); await dbSaveProjects(isoToday(),PROJECTS); hideOverlay(); renderAdmin(document.getElementById('app')); }
async function clearDayProjects() { if(!confirm('Eliminar todos los proyectos de hoy?'))return; showOverlay('Eliminando...'); try { await dbSaveProjects(isoToday(),[]); } catch(e){} PROJECTS = await dbGetAllProjects(); hideOverlay(); renderAdmin(document.getElementById('app')); }

async function clearSpecificDay() {
  var picker = document.getElementById('del-date-picker');
  if (!picker || !picker.value) { alert('Selecciona una fecha primero.'); return; }
  var iso = picker.value;
  var display = isoToDisplay(iso);
  if (!confirm('Eliminar todos los proyectos del ' + display + '?')) return;
  showOverlay('Eliminando...');
  try { await dbSaveProjects(iso, []); } catch(e) {}
  PROJECTS = await dbGetAllProjects();
  hideOverlay();
  renderAdmin(document.getElementById('app'));
}

function dragOver(e){e.preventDefault();document.getElementById('eml-drop').style.borderColor='var(--blue)';}
function dragLeave(){document.getElementById('eml-drop').style.borderColor='';}
function dropFile(e){e.preventDefault();dragLeave();var f=e.dataTransfer.files[0];if(f)handleEmlFile(f);}

async function handleEmlFile(file) {
  if(!file)return;
  var alertEl=document.getElementById('eml-alert');
  alertEl.innerHTML='<div class="alert info">Leyendo archivo...</div>';
  try {
    var text=await file.text();
    var plain='';
    var idx=text.indexOf('Content-Type: text/plain');
    if(idx>=0){var start=text.indexOf('\n\n',idx);if(start>=0){var end=text.indexOf('\n--',start+2);var chunk=end>=0?text.substring(start+2,end):text.substring(start+2);chunk=chunk.replace(/\s/g,'');try{plain=decodeURIComponent(escape(atob(chunk)));}catch(e){plain=chunk;}}}
    if(!plain)plain=text;
    var dm=null;var fn=file.name.match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})/);if(fn)dm=fn;
    if(!dm){var subj=text.match(/Subject:[^\n]*/);if(subj)dm=subj[0].match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})/);}
    var snippetDate=isoToday();
    if(dm)snippetDate=dm[3]+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0');
    showOverlay('Procesando con IA...','Extrayendo proyectos del snippet');
    var projects=await parseEmlWithAI(plain,snippetDate);
    if(!projects||!projects.length){hideOverlay();alertEl.innerHTML='<div class="alert error">No se encontraron proyectos.</div>';return;}
    var existing=await dbGetProjects(snippetDate);
    var merged=existing.concat(projects.map(function(p){p.id=Date.now()+Math.random();return p;}));
    await dbSaveProjects(snippetDate,merged);PROJECTS=merged;
    hideOverlay();alertEl.innerHTML='<div class="alert success"><i class="ti ti-check"></i> '+projects.length+' proyectos cargados para el '+isoToDisplay(snippetDate)+'</div>';
    document.getElementById('eml-input').value='';
    setTimeout(function(){renderAdmin(document.getElementById('app'));},1500);
  } catch(err){hideOverlay();alertEl.innerHTML='<div class="alert error">Error: '+err.message+'</div>';}
}

async function parseEmlWithAI(text, snippetDate) {
  var dd=isoToDisplay(snippetDate);
  var prompt='Sos un asistente especializado en analisis de textos legislativos argentinos. Analiza el siguiente Daily Legal Snippet y extrae TODOS los proyectos de ley.\n\nPara cada proyecto extrae:\n- num: numero de expediente\n- sector: uno de: Coyuntura general, Consumo masivo, Medios de pago, Tecnologia, Automotriz, Agroindustria, Petroquimicos, Mineria, Turismo, Salud, Ambiente\n- jur: exactamente uno de: Nacional, CABA, Buenos Aires, Catamarca, Chaco, Chubut, Cordoba, Corrientes, Entre Rios, Formosa, Jujuy, La Pampa, La Rioja, Mendoza, Misiones, Neuquen, Rio Negro, Salta, San Juan, San Luis, Santa Cruz, Santa Fe, Santiago del Estero, Tierra del Fuego, Tucuman, Municipal\n- org: nombre del organismo\n- autor: autor/es\n- title: titulo descriptivo (max 150 chars)\n- resumen: objeto SIN "tiene por objeto" al inicio\n- linkExpediente: URL si aparece\n- linkTexto: URL PDF si aparece\n- fecha: DD/MM/YYYY (default: '+dd+')\n\nResponde UNICAMENTE con JSON array valido, sin markdown ni backticks.\n\nTEXTO:\n'+text.substring(0,8000);
  var resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,messages:[{role:'user',content:prompt}]})});
  if(!resp.ok)throw new Error('API '+resp.status);
  var data=await resp.json();
  var raw=data.content.map(function(b){return b.text||'';}).join('').trim().replace(/^```json|^```|```$/g,'').trim();
  return JSON.parse(raw);
}

  document.getElementById('nav-date').textContent=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  buildNav(); renderLogin();
}
init();
