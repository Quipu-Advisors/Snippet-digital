<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Snippet</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F4F3EF;--surface:#FFFFFF;--border:#DDD9D2;--border-light:#E9E6DF;--text:#2C2C2A;--text2:#5F5E5A;--text3:#888780;--blue:#395279;--blue-bg:#E8EEF5;--blue-dark:#2D4060;--accent:#C0714D;--accent-bg:#FDF5F0;--accent-border:#E8C4A8;--green-bg:#EAF3DE;--green:#3B6D11;--green-border:#639922;--orange-bg:#FAEEDA;--orange:#633806;--orange-border:#EF9F27;--red-bg:#FCEBEB;--red:#791F1F;--red-border:#F09595;--yellow-bg:#FEF3E2;--yellow:#7A4A00;--radius:6px;--radius-lg:8px;}
body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{display:flex;align-items:center;background:var(--blue);border-bottom:2px solid var(--accent);padding:0 1.25rem;height:48px}
.nav-logo{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-right:24px;display:flex;align-items:center;gap:7px;color:#fff}
.nav-logo span{color:var(--accent)}
#nav-tabs{display:flex;align-items:center;height:48px}
.nav-tab{display:flex;align-items:center;gap:6px;padding:0 14px;height:48px;font-size:12px;font-weight:500;letter-spacing:.02em;color:#CBD7E6;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;opacity:.6;transition:opacity .15s}
.nav-tab:hover{opacity:.9}
.nav-tab.active{color:#fff;border-bottom-color:var(--accent);font-weight:700;opacity:1}
.step-n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.18);color:#CBD7E6;font-size:10px;font-weight:700}
.nav-tab.active .step-n{background:var(--accent);color:#fff}
.nav-chev{display:flex;align-items:center;color:#7E93B0;opacity:.7;font-size:15px;padding:0 1px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.nav-fecha{font-size:11px;color:#A8BCD4;text-transform:capitalize;font-weight:300}
.nav-user{display:flex;align-items:center;gap:6px;font-size:12px;color:#E8EEF5;font-weight:600}
.nav-user i{font-size:17px;color:var(--accent)}
.nav-logout{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 12px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.28);background:transparent;color:#CBD7E6;cursor:pointer}
.nav-logout:hover{border-color:var(--accent);color:#fff;background:var(--accent)}
.mulita-help{position:relative;display:flex;align-items:center;cursor:help;color:#CBD7E6}
.mulita-help:hover{color:#fff}
.mulita-img{height:17px;width:auto;display:block}
.mulita-help:hover .mulita-img{filter:brightness(1.25)}
.help-pop{display:none;position:absolute;top:150%;right:0;z-index:200;width:330px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--radius-lg);box-shadow:0 10px 28px rgba(0,0,0,.2);padding:14px 16px;cursor:default}
.mulita-help:hover .help-pop,.mulita-help:focus-within .help-pop{display:block}
.help-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--blue);margin-bottom:10px}
.mulita-img.sm{height:18px;flex-shrink:0;filter:brightness(.5)}
.help-steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.help-steps li{font-size:12px;line-height:1.45;color:var(--text2)}
.help-steps b{color:var(--text);font-weight:700}
.help-intro{font-size:11.5px;color:var(--text2);line-height:1.45;margin-bottom:10px}
.welcome-ov{position:fixed;inset:0;background:rgba(44,44,42,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:2rem}
.welcome-card{background:var(--surface);border-radius:var(--radius-lg);max-width:560px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.welcome-x{position:absolute;top:10px;right:14px;background:transparent;border:none;color:#fff;font-size:26px;line-height:1;cursor:pointer;opacity:.85;padding:0}
.welcome-x:hover{opacity:1}
.welcome-head{background:var(--blue);padding:22px 28px;display:flex;align-items:center;gap:16px}
.welcome-mulita{height:46px;width:auto;flex-shrink:0}
.welcome-title{color:#fff;font-size:20px;font-weight:800;line-height:1.2}
.welcome-title b{color:var(--accent)}
.welcome-body{padding:20px 28px 24px}
.welcome-lead{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px}
.welcome-steps{margin:0 0 18px;padding-left:20px;display:flex;flex-direction:column;gap:9px}
.welcome-steps li{font-size:13px;line-height:1.5;color:var(--text2)}
.welcome-steps b{color:var(--text);font-weight:700}
.welcome-go{width:100%;justify-content:center}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 48px);padding:2rem}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;width:100%;max-width:380px}
.login-card.wide{max-width:760px;background:transparent;border:0;padding:0}
.lg-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:stretch}
.login-title{font-size:18px;font-weight:800;letter-spacing:.01em;margin-bottom:4px}
.lg-group-title i{font-size:13px}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:1.5rem}
.lg-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.login-opt{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--surface);min-width:0}
.login-opt i{font-size:16px;flex-shrink:0}
.login-opt strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.login-opt span{font-size:11px;color:var(--text3)}
.lg-group{border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:0}
.lg-group-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.lg-research{background:var(--blue-bg);border-color:#C3D2E6}
.lg-research .lg-group-title{color:var(--blue)}
.lg-research .login-opt i{color:var(--blue)}
.lg-research .login-opt:hover{border-color:var(--blue);background:#F2F6FB}
.lg-pa{background:var(--accent-bg);border-color:var(--accent-border)}
.lg-pa .lg-group-title{color:var(--accent)}
.lg-pa .login-opt i{color:var(--accent)}
.lg-pa .login-opt:hover{border-color:var(--accent);background:#FBEFE7}
.login-foot{text-align:center;margin-top:14px;font-size:11px;color:var(--text3)}
.login-foot a{color:var(--text3);text-decoration:underline;cursor:pointer}
.gate-input{width:100%;font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);outline:none;margin-bottom:10px}
.gate-input:focus{border-color:var(--blue)}
.m-hdr{display:flex;align-items:center;gap:10px;padding:.9rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.m-hdr-title{font-size:15px;font-weight:500}
.m-date{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.m-date input{font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;color:var(--text)}
.history-badge{font-size:11px;padding:2px 8px;border-radius:var(--radius);background:var(--yellow-bg);color:var(--yellow);font-weight:500}
.toolbar{display:flex;align-items:center;gap:10px;padding:.65rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;position:relative}
.toolbar label{font-size:13px;color:var(--text2)}
.toolbar .tb-date{font-size:13px;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;color:var(--text);background:var(--surface);cursor:pointer}
.tb-sep{width:1px;align-self:stretch;background:var(--border);margin:2px 6px}
.tb-clear{font-size:11px;padding:5px 9px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer}
.tb-clear:hover{border-color:var(--accent);color:var(--accent)}
.tb-search{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.tb-search:focus-within{border-color:var(--blue)}
.tb-search i{color:var(--text3);font-size:15px;flex-shrink:0}
.tb-search input{border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;color:var(--text);width:220px;max-width:40vw}
.tb-countdown{position:relative;margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap;cursor:default}
.tb-countdown.urgent{color:var(--red)}
.tb-countdown:empty{display:none}
.cd-tip{display:none;position:absolute;top:150%;right:0;z-index:50;width:260px;white-space:normal;background:#fff;color:var(--blue);font-size:12px;font-weight:400;line-height:1.4;padding:10px 12px;border:1px solid var(--accent-border,#e0cdc0);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.tb-countdown:hover .cd-tip{display:block}
.tb-toggle{margin-left:16px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;user-select:none;flex-shrink:0}
.hoy-nuevos{color:var(--accent);font-weight:700;font-size:15px;margin-left:auto}
.sin-leer{color:var(--text2);font-weight:600;font-size:12px;margin-left:auto}
.tb-toggle input{display:none}
.tb-switch{width:34px;height:18px;border-radius:20px;background:var(--border);position:relative;transition:background .15s;flex-shrink:0}
.tb-switch::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tb-toggle input:checked + .tb-switch{background:var(--accent)}
.tb-toggle input:checked + .tb-switch::after{transform:translateX(16px)}
.tb-toggle input:checked ~ span:last-child{color:var(--accent);font-weight:600}
.dd-wrap{position:relative}
.dd-btn{font-size:13px;height:30px;padding:0 28px 0 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;min-width:140px;text-align:left;position:relative}
.dd-btn::after{content:'';position:absolute;right:10px;top:50%;transform:translateY(-50%);border:4px solid transparent;border-top-color:var(--text3);margin-top:2px}
.dd-menu{display:none;position:absolute;top:34px;left:0;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-width:200px;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.08);max-height:320px;overflow-y:auto}
.dd-menu.open{display:block}
.dd-item{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none}
.dd-item:hover{background:var(--bg)}
.dd-item input[type=checkbox]{width:14px;height:14px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.dd-item.sub{padding-left:28px;font-size:12px;color:var(--text2)}
.dd-divider{border:none;border-top:1px solid var(--border-light);margin:3px 0}
.dd-group-label{padding:6px 12px 2px;font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.list{padding:1.75rem 2rem;display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto;width:100%}
.group-sector-title{font-size:13px;font-weight:700;color:var(--text);padding:14px 0 8px;margin-bottom:6px}
.group-jur-title{font-size:9px;font-weight:700;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;padding:6px 0 4px;margin-top:4px}
.group-jur-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.card{position:relative;border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;background:var(--surface);cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:border-color .12s,box-shadow .12s}
.card:not(.sel):hover{border-color:var(--accent-border);box-shadow:0 1px 6px rgba(57,82,121,.06)}
.card.sel{border:1.5px solid var(--blue);background:var(--surface);box-shadow:0 2px 10px rgba(57,82,121,.08)}
.card.sel .ctitle{color:var(--blue)}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.card.sel .chk{background:var(--blue);border-color:var(--blue)}
.cinfo{flex:1;min-width:0}
.ctitle{font-size:16px;font-weight:600;line-height:1.4}
.tipo-ico{font-size:14px;color:var(--accent);margin-right:5px;vertical-align:-1px}
.tipo-label{color:var(--accent);font-weight:400;font-size:13px}
.card.sel .ctitle{margin-bottom:8px}
.cmeta-min{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.others-mark{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--accent)}
.card-chev{margin-left:auto;align-self:center;color:var(--text3);opacity:.4;font-size:18px;flex-shrink:0;transition:opacity .12s}
.card:not(.sel):hover .card-chev{opacity:.85}
.cmeta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.pill{font-size:11px;padding:2px 7px;border-radius:var(--radius);font-weight:500}
.p-num{background:#F1EFE8;color:#5F5E5A;font-weight:600}
.p-org{background:#F1EFE8;color:#5F5E5A;font-weight:400}
.p-fecha{background:var(--bg);color:var(--text2);font-weight:400}
.p-tema{background:var(--blue-bg);color:var(--blue);border:0.5px solid #C3D2E6}
.card.rated{border-left:3px solid var(--green-border)}
.card.nuevo{border-left:3px solid var(--accent)}
.card.read:not(.sel),.card.rated:not(.sel){opacity:.6}
.card.read:not(.sel):hover,.card.rated:not(.sel):hover{opacity:1}
.card-status{display:flex;align-items:center;gap:12px;margin-top:7px;flex-wrap:wrap}
.cs{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.cs-leido{color:var(--text3)}
.cs-rot{color:var(--green)}
.cs-late{color:var(--red)}
.late-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:var(--radius);padding:8px 12px;margin-bottom:10px}
.late-msg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent)}
.cs-clock{height:15px;width:auto;display:inline-block;vertical-align:middle}
.late-btn{font-size:11px;font-weight:700;padding:5px 11px;border-radius:var(--radius);border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
.late-btn:hover{background:var(--accent);color:#fff}
.imp-select:disabled{opacity:.5;cursor:not-allowed;background:var(--bg);color:var(--text3)}
.late-mt{margin-top:12px;display:flex;align-items:center;gap:10px}
.late-mt .mt-ok{font-size:12px;color:var(--green);display:inline-flex;align-items:center;gap:4px}
.card-nuevo{position:absolute;top:0;right:0;background:var(--accent);color:#fff;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:0 8px 0 8px}
.card-overdue{position:absolute;right:16px;bottom:14px;height:16px}
.cresumen{font-size:14px;color:var(--text2);line-height:1.55;white-space:pre-wrap}
.cautor{font-size:12px;color:var(--text);font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:5px}
.cautor i{color:var(--accent)}
.impacts-section{margin-top:0}
.impacts-title{font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.impacts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 22px}
.imp-item{display:flex;align-items:center;gap:8px;min-width:0}
.imp-ctrl{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.imp-label{width:116px;flex:none;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-select{font-size:11px;height:24px;padding:0 4px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);min-width:62px;width:100%}
.imp-select.alto{background:var(--red-bg);color:var(--red);border-color:var(--red-border);font-weight:600}
.imp-select.medio{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border);font-weight:600}
.imp-select.bajo{background:var(--green-bg);color:var(--green);border-color:var(--green-border);font-weight:600}
.imp-by{font-size:9px;color:var(--text3);font-weight:500;line-height:1.15;white-space:normal;overflow-wrap:anywhere}
.clink{font-size:11px;color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.cimpact{flex-shrink:0;border-left:1px solid var(--border-light);padding-left:14px;min-width:140px;max-width:180px}
.cimpact.wide{flex:0 0 46%;max-width:46%;min-width:400px}
.other-imps{margin-bottom:12px}
.other-imps-t{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.other-imp-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.other-imp-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;flex-shrink:0}
.other-imp-name{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer{padding:1rem 1.25rem;border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0}
.footer-top{display:flex;align-items:center;justify-content:space-between}
.footer-info{font-size:13px;color:var(--text2)}
.save-status{font-size:12px;color:var(--text3);display:inline-flex;align-items:center;gap:5px}
.save-status.ok{color:var(--green)}
.save-status.err{color:var(--red)}
.spin-sm{display:inline-block;animation:spin 1s linear infinite}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-top:10px}
.alert.success{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.alert.error{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}
.alert.info{background:var(--blue-bg);border:1px solid var(--blue);color:var(--blue-dark)}
.admin-body{padding:1.5rem;max-width:960px;margin:0 auto}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.25rem}
.admin-card-title{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.admin-card-sub{font-size:12px;color:var(--text3);margin-bottom:1rem}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field-grid.full{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:500;color:var(--text2)}
.field input,.field select,.field textarea{font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.pi-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);font-size:13px;margin-bottom:8px}
.pi-num{background:var(--blue-bg);color:var(--blue-dark);font-size:11px;padding:2px 7px;border-radius:var(--radius);font-weight:500;white-space:nowrap}
.pi-title{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-jur{font-size:11px;color:var(--text3);white-space:nowrap}

<script>
/* ============================================================
   CONFIGURACION
   ============================================================ */
var SB_URL  = 'https://xyqmtqsczscdejcwusce.supabase.co';
// Clave PUBLICA (anon/publishable) de Supabase.
var SB_ANON = 'sb_publishable_LHaQlBOrhJ5CRyISMiuXhg_0s6Unaxf';

// >>> Contraseña compartida del equipo. CAMBIALA por la que quieras y compartila solo
//     con el equipo. Es un control liviano: la clave viaja en el HTML, así que sirve
//     para que la app no quede a la vista de cualquiera que caiga de casualidad, no
//     como seguridad fuerte. La URL se comparte solo dentro del equipo.
var TEAM_PASSWORD = 'bachacero2026';

/* ============================================================
   GATE (contraseña del equipo, lado cliente)
   ============================================================ */
function gatePassed() { try { return localStorage.getItem('sd_gate') === '1'; } catch(e) { return false; } }
function setGatePassed(v) { try { if (v) localStorage.setItem('sd_gate','1'); else localStorage.removeItem('sd_gate'); } catch(e) {} }

/* ============================================================
   CAPA SUPABASE (REST)
   ============================================================ */
async function sbFetch(path, method, body) {
  var opts = {method: method || 'GET', headers: {'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON, 'Content-Type': 'application/json', 'Prefer': 'return=representation'}};
  if (body) opts.body = JSON.stringify(body);
  var r = await fetch(SB_URL + '/rest/v1/' + path, opts);
  var t = await r.text();
  if (!r.ok) throw new Error('DB ' + r.status + (t ? ': ' + t.slice(0, 120) : ''));
  return t ? JSON.parse(t) : null;
}

// Proyectos de UNA fecha (ISO). Cada fila projects = {date, data:[...proyectos]}.
async function dbGetProjects(d) {
  try { var r = await sbFetch('projects?date=eq.' + d + '&select=data'); return normalizeProjects((r && r[0] && r[0].data) || []); }
  catch(e) { return []; }
}
// Todos los proyectos de todas las fechas (vista histórica). Cada proyecto queda marcado
// con _d = la fecha (ISO) de la fila en que se cargó.
async function dbGetAllProjects() {
  try {
    var r = await sbFetch('projects?select=date,data&order=date.desc');
    var all = [];
    (r || []).forEach(function(row){ (row.data || []).forEach(function(p){ p._d = row.date; all.push(p); }); });
    all = normalizeProjects(all);
    all.sort(function(a,b){ return fechaSortKey(b.fecha).localeCompare(fechaSortKey(a.fecha)); });
    return all;
  } catch(e) { return []; }
}
// Reemplaza la fila de UNA fecha con la lista dada (solo proyectos de esa fecha).
async function dbSaveProjects(d, ps) {
  await sbFetch('projects?date=eq.' + d, 'DELETE');
  if (ps.length) await sbFetch('projects', 'POST', {id: Date.now(), date: d, data: ps});
}
// Selecciones de UNA fecha: {manager: data}. (Solo para compatibilidad / admin.)
async function dbGetSelections(d) {
  try { var r = await sbFetch('selections?date=eq.' + d + '&select=manager,data'); var o = {}; (r || []).forEach(function(x){ o[x.manager] = x.data; }); return o; }
  catch(e) { return {}; }
}
// TODAS las selecciones de TODOS los managers, fusionadas por manager (histórico).
// Cada proyecto vive en un solo día, así que la unión por id no tiene conflictos.
async function dbGetAllSelections() {
  try {
    var r = await sbFetch('selections?select=manager,data');
    var out = {};
    (r || []).forEach(function(x){ if(!out[x.manager]) out[x.manager]={}; Object.assign(out[x.manager], x.data || {}); });
    return out;
  } catch(e) { return {}; }
}
// Guarda TODA la selección de un manager en una sola fila (date-agnóstica).
// Borra cualquier fila previa del manager (consolida datos viejos por día).
var SEL_DATE = '2000-01-01';
async function dbSaveSelectionAll(m, data) {
  await sbFetch('selections?manager=eq.' + encodeURIComponent(m), 'DELETE');
  if (data && Object.keys(data).length) await sbFetch('selections', 'POST', {date: SEL_DATE, manager: m, data: data, updated_at: new Date().toISOString()});
}

/* ============================================================
   CONSTANTES DE NEGOCIO
   ============================================================ */
var SECTORES = ['Coyuntura general','Consumo masivo','Medios de pago','Tecnologia','Automotriz','Agroindustria','Petroquimicos','Mineria','Turismo','Salud','Ambiente'];
var PROVINCIAS = ['CABA','Buenos Aires','Catamarca','Chaco','Chubut','Cordoba','Corrientes','Entre Rios','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquen','Rio Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego','Tucuman'];
// Monitoreo regional (2026-09): países además de Argentina. No sincronizan a DLS (ver api/sync.js
// del repo daily-legislative-snippet, filtra PAISES_REGIONALES).
var PAISES_REGIONALES = ['Chile','Uruguay','Paraguay'];
var JUR_ORDER = ['Nacional'].concat(PROVINCIAS).concat(['Municipal']).concat(PAISES_REGIONALES);
// Nombre a MOSTRAR para una jurisdicción, si difiere de su clave interna (JUR_ORDER). 'Nacional'
// se muestra como 'Argentina' — la clave interna NO se renombra (ya está guardada en Supabase en
// cada proyecto/norma, y el export a Lark depende del valor 'Nacional'); mismo patrón que
// CLIENT_LABEL más abajo.
var JUR_LABEL = {'Nacional':'Argentina'};
function jurLabel(j) { return JUR_LABEL[j] || j; }
// Agrupación visual de jurisdicciones en los filtros (no cambia el valor guardado).
var JUR_GROUP = {};
PROVINCIAS.forEach(function(p){ JUR_GROUP[p] = 'PROVINCIAL ARGENTINA'; });
JUR_GROUP['Municipal'] = 'MUNICIPAL ARGENTINA';
var CLIENTS = ['Amazon (grado)','AMEX','Coca','Kenvue','Spotify','AWS','TikTok','Roblox','Syngenta','Airbnb','World','Tetrapak','Sanofi','Rio Tinto','Microsoft','Didi','Dow','Renault','BMW','CIQyP'];
// Nombre a MOSTRAR/EXPORTAR para un cliente, si difiere de su clave interna (CLIENTS).
// La clave interna ('Coca') no se toca: es la que ya está guardada en Supabase para cada
// calificación cargada; renombrarla ahí perdería el historial. Este mapeo solo cambia el
// texto que ve el usuario y el que sale en "Clientes afectados" del Master Tracker, para que
// el filtro de búsqueda del tracker matchee exacto (pedido de Cami, 2026-08).
var CLIENT_LABEL = {'Coca':'Coca-Cola'};
function clientLabel(c) { return CLIENT_LABEL[c] || c; }
var IMPACT = ['-','Alto','Medio','Bajo','N/A'];
var RESEARCH = ['Camila','Victoria','Lucas MS','Erika'];
var PUBLIC_AFFAIRS = ['Carolina','Chiara','Hernan','Felicitas','Ana','Agustina','Milagros','Nicolás','Federico','Lucas Barreiros','Shunko','Lucas Bello'];
var MANAGERS = RESEARCH.concat(PUBLIC_AFFAIRS);
// Nombre para mostrar sin tocar la clave interna (mismo patrón que CLIENT_LABEL/JUR_LABEL) — la
// clave queda guardada en cada calificación de Supabase, no se renombra para no romper historial.
var MANAGER_LABEL = {'Hernan':'Hernán'};
function managerLabel(m) { return MANAGER_LABEL[m] || m; }
function isResearch(name) { return RESEARCH.indexOf(name) >= 0; }
// Export a Lark (TikTok): quiénes ven la pestaña "Consolidado TikTok" además de su vista normal.
// Solo la gente autorizada a entrar a Lark — agregar/quitar nombres acá.
var LARK_CLIENT = 'TikTok';
var LARK_USERS = ['Milagros'];
function canLark(name) { return LARK_USERS.indexOf(name) >= 0; }
var TEMAS = [{tema:'Datos personales',keys:['dato personal','privacidad']},{tema:'Inteligencia artificial',keys:['inteligencia artificial','algoritm']},{tema:'Grooming',keys:['grooming']},{tema:'Plataformas digitales',keys:['plataforma digital']},{tema:'Derechos laborales',keys:['laboral','trabajador']},{tema:'Redes Sociales',keys:['red social','redes sociales']},{tema:'Educacion',keys:['educati','escolar','escuela']},{tema:'Impuestos',keys:['fiscal','tributari','impuesto']},{tema:'Ambiental',keys:['ambiental','residuo']},{tema:'Medicamentos',keys:['medicamento','farmaco']},{tema:'Biocombustibles',keys:['biocombustible','hidrocarburo']},{tema:'Litio',keys:['litio']},{tema:'Semillas',keys:['semilla']},{tema:'Turismo',keys:['turismo']},{tema:'Lobby',keys:['lobby','cabildeo']},{tema:'Salud mental',keys:['suicida','salud mental']},{tema:'Restricciones comerciales',keys:['exportacion','arancel']}];

// Buckets de fallback para que nada desaparezca de los filtros.
var SECTOR_OTRO = 'Otros', JUR_OTRA = 'Otras';
var SECTOR_FILTER = SECTORES.concat([SECTOR_OTRO]);

var PROJECTS = [], SELS = {}, currentUser = null, viewDate = '', localSel = {}, localImp = {}, localImpTs = {}, expanded = {}, readSet = {}, onlyToday = false, filterDate = '', saveTimer = null;
// Token anti-carrera: cada render async lo incrementa al arrancar y lo chequea después de
// cada await. Si otra vista arrancó mientras cargaba, la respuesta vieja se descarta (si no,
// pisaba PROJECTS/SELS de la vista activa — ej. el filtro por fecha quedaba vacío).
var renderSeq = 0;
function setRepDate(v) { filterDate = v || ''; renderList(); }
function clearRepDate() { filterDate = ''; var el=document.getElementById('rep-date'); if(el) el.value=''; renderList(); }
var searchQ = '';
function setSearch(v) { searchQ = v || ''; renderList(); }
var overrideLate = {};  // por tarjeta: el usuario clickeó "Cargar fuera de fecha" (sesión)
// "Leído" por usuario (qué proyectos abrió), persistido en el navegador.
function loadReadSet() { readSet = {}; try { (JSON.parse(localStorage.getItem('sd_read_'+(currentUser||''))||'[]')).forEach(function(id){ readSet[String(id)]=1; }); } catch(e) {} }
function markRead(id) { id=String(id); if(readSet[id]) return; readSet[id]=1; try { localStorage.setItem('sd_read_'+(currentUser||''), JSON.stringify(Object.keys(readSet))); } catch(e) {} }
function setOnlyToday(v) { onlyToday = !!v; renderList(); }
var _idSeq = 0;

/* ============================================================
   UTILIDADES
   ============================================================ */
function isoToday() {
  var d = new Date(), p = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function isoToDisplay(iso) { if (!iso) return ''; var p = iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function todayStr() { return isoToDisplay(isoToday()); }
function fechaSortKey(f) { return (f && f.indexOf('/')>=0) ? f.split('/').reverse().join('') : ''; }
function newId() { return String(Date.now()) + String(1000 + (_idSeq++ % 9000)); }
function showOverlay(msg, sub) { document.getElementById('overlay').classList.add('show'); document.getElementById('overlay-msg').textContent = msg; document.getElementById('overlay-sub').textContent = sub||''; }
function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }

// Escapa texto para insertar en HTML (evita romper el render / XSS).
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// URL segura para usar en href (solo http/https).
function safeUrl(u) { u = String(u||'').trim(); return /^https?:\/\//i.test(u) ? esc(u) : ''; }
// Normaliza para comparar ignorando acentos/mayusculas.
function norm(s) { return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }

function canonSector(s) { var n = norm(s); for (var i=0;i<SECTORES.length;i++) if (norm(SECTORES[i])===n) return SECTORES[i]; return s ? SECTOR_OTRO : SECTOR_OTRO; }
function canonJur(j) { var n = norm(j); for (var i=0;i<JUR_ORDER.length;i++) if (norm(JUR_ORDER[i])===n) return JUR_ORDER[i]; return j ? JUR_OTRA : JUR_OTRA; }
// Sin `tipo` (datos viejos, previos a este campo) = proyecto_ley, para no romper nada ya cargado.
function canonTipo(t) { return (t === 'norma' || t === 'resumen_sesion') ? t : 'proyecto_ley'; }
function ambitoOf(p) {
  var t = canonTipo(p && p.tipo);
  if (t === 'norma') return 'Boletines oficiales';
  if (t === 'resumen_sesion') return 'Alertas de sesión';
  return 'Proyectos de ley';
}
// resumen_sesion es solo informativo: nunca lleva calificación de impacto por cliente.
// Corrección 2026-09-04: norma también es puramente informativa, igual que resumen_sesion — solo
// proyecto_ley se rotula. Antes norma sí llevaba calificación; se cambió a pedido de Lucas.
function llevaImpacto(p) { return canonTipo(p && p.tipo) === 'proyecto_ley'; }

// Limpia/normaliza una lista de proyectos al cargarla.
function normalizeProjects(list) {
  return (list||[]).map(function(p){
    p.id = (p.id==null) ? newId() : String(p.id);
    p.tipo = canonTipo(p.tipo);
    p.sector = canonSector(p.sector);
    p.jur = canonJur(p.jur);
    if (!p.fecha) p.fecha = '';
    return p;
  });
}

function mapTema(title, resumen) {
  var txt = norm((title||'') + ' ' + (resumen||''));
  for (var i = 0; i < TEMAS.length; i++) { for (var j = 0; j < TEMAS[i].keys.length; j++) { if (txt.indexOf(norm(TEMAS[i].keys[j])) >= 0) return TEMAS[i].tema; } }
  return 'Otro';
}
// Tema a mostrar: prioriza el que generó la skill (libre); cae al detector por keywords.
// Devuelve '' si no hay tema real (no mostramos el chip "Otro").
function temaOf(p) {
  var t = (p.tema && String(p.tema).trim()) || mapTema(p.title, p.resumen);
  return (!t || t === 'Otro') ? '' : t;
}
// ¿El proyecto se cargó hoy? El id arranca con el timestamp (ms) de cuando se creó.
function loadedToday(p) {
  var ms = parseInt(String(p.id || '').slice(0, 13), 10);
  if (!ms || ms < 1000000000000) return false;
  var d = new Date(ms), t = new Date();
  return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
}

/* ============================================================
   FECHAS DE CORTE — los acct managers deben rotular antes del próximo corte.
   Configurable: días de la semana (0=Dom..6=Sáb; 2=Mar, 5=Vie) y hora.
   ============================================================ */
var CUTOFF_DOWS = [2, 5];   // martes y viernes
var CUTOFF_HOUR = 12;        // 12:00
// Deadline de un proyecto: el PRIMER corte (Mar/Vie 12:00) ESTRICTAMENTE POSTERIOR al día de reporte.
// No cuenta el corte del propio día de carga (si no, lo cargado un viernes a la tarde vencería al instante).
// Ej.: reportado viernes -> vence el martes 12:00; reportado martes -> vence el viernes 12:00;
//      reportado miércoles/jueves -> vence el viernes 12:00; reportado lunes -> vence el martes 12:00.
function cutoffDeadline(repIso) {
  if (!repIso) return null;
  var pr = String(repIso).split('-'); if (pr.length !== 3) return null;
  var c = new Date(parseInt(pr[0]), parseInt(pr[1])-1, parseInt(pr[2])+1, CUTOFF_HOUR, 0, 0, 0); // día SIGUIENTE al reporte, 12:00
  for (var i=0; i<14; i++) {
    if (CUTOFF_DOWS.indexOf(c.getDay()) >= 0) return c;
    c = new Date(c.getFullYear(), c.getMonth(), c.getDate()+1, CUTOFF_HOUR, 0, 0, 0);
  }
  return c;
}
function isOverdue(p) {
  if (p && p.tipo && p.tipo !== 'proyecto_ley') return false; // solo proyectos de ley vencen (norma/resumen_sesion no tienen giro)
  var dl = cutoffDeadline(p && p._d); if (!dl) return false;
  return new Date().getTime() > dl.getTime();
}
// Próximo corte (Mar/Vie 12:00) estrictamente posterior a 'now'.
function nextCutoff(now) {
  var c = new Date(now.getFullYear(), now.getMonth(), now.getDate(), CUTOFF_HOUR, 0, 0, 0);
  for (var i=0; i<14; i++) {
    if (CUTOFF_DOWS.indexOf(c.getDay()) >= 0 && c.getTime() > now.getTime()) return c;
    c = new Date(c.getFullYear(), c.getMonth(), c.getDate()+1, CUTOFF_HOUR, 0, 0, 0);
  }
  return c;
}
function cutoffLong(d) {
  var dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return dias[d.getDay()]+' '+d.getDate()+' de '+meses[d.getMonth()];
}
function updateCountdown() {
  var el = document.getElementById('countdown'); if (!el) return;
  var nc = nextCutoff(new Date());
  var ms = nc.getTime() - Date.now();
  if (ms <= 0) { el.textContent=''; return; }
  var mins = Math.floor(ms/60000), d = Math.floor(mins/1440), h = Math.floor((mins%1440)/60), m = mins%60;
  var t = (d? d+'d ':'') + ((h||d)? h+'h ':'') + m+'m';
  var tip = 'Recordá revisar los proyectos nuevos y marcar su impacto antes del ' + cutoffLong(nc) + ' a las ' + (CUTOFF_HOUR<10?'0':'') + CUTOFF_HOUR + ':00.';
  el.innerHTML = '<img class="cs-clock" src="calendario.png" alt=""> Próximo corte en ' + t + '<span class="cd-tip">' + esc(tip) + '</span>';
  el.className = 'tb-countdown' + (mins < 360 ? ' urgent' : '');
}
function projectById(pid) { pid=String(pid); for (var i=0;i<PROJECTS.length;i++) if (String(PROJECTS[i].id)===pid) return PROJECTS[i]; return null; }
function unlockLate(pid) { overrideLate[String(pid)]=1; renderList(); }
// Borra UN ítem puntual (no el día completo), desde donde sea que se lo esté viendo (histórico,
// consolidado). Solo Research (isResearch gatea el botón en cardHTML). p._d lo trae dbGetAllProjects;
// si no está (viendo desde la pestaña "Cargar proyectos"), usa adminDate como fallback.
async function adminDeleteItem(pid) {
  pid = String(pid);
  var p = projectById(pid); if (!p) return;
  if (!confirm('Eliminar este ítem? No se puede deshacer.')) return;
  var day = p._d || adminDate;
  showOverlay('Eliminando...');
  try {
    var dayList = await dbGetProjects(day);
    var filtered = dayList.filter(function(x){ return String(x.id) !== pid; });
    await dbSaveProjects(day, filtered);
    PROJECTS = PROJECTS.filter(function(x){ return String(x.id) !== pid; });
  } catch(e) { hideOverlay(); alert('Error: ' + e.message); return; }
  hideOverlay();
  renderList();
}
function copyMtRow(pid) {
  pid=String(pid); var p=projectById(pid); if(!p) return;
  var sels={}; Object.keys(SELS).forEach(function(m){ sels[m]=SELS[m]; });
  sels[currentUser]=Object.assign({}, SELS[currentUser]||{}); sels[currentUser][pid]={impacts:localImp[pid]||{}, impTs:localImpTs[pid]||{}, ts:Date.now()};
  var row=buildRows([p], sels);
  var ok=function(){ var e=document.getElementById('mtok-'+pid); if(e){ e.style.display='inline'; setTimeout(function(){e.style.display='none';},2200); } };
  try { navigator.clipboard.writeText(row).then(ok).catch(function(){ fallbackCopy(row, ok); }); } catch(e) { fallbackCopy(row, ok); }
}

// Ícono chico junto al título para distinguir el tipo de un vistazo, sin abrir la tarjeta.
function tipoIconHTML(p) {
  if (p && p.tipo === 'resumen_sesion') return '<i class="ti ti-messages tipo-ico" title="Resumen de sesión — solo informativo"></i>';
  if (p && p.tipo === 'norma') return '<i class="ti ti-gavel tipo-ico" title="Norma del Boletín Oficial"></i>';

// con el ícono nomás — así no le suma texto a la vista mínima).
function tipoLabelHTML(p) {
  var t = canonTipo(p && p.tipo);
  if (t === 'norma') return ' <span class="tipo-label">(norma en vigor)</span>';
  if (t === 'proyecto_ley') return ' <span class="tipo-label">(proyecto de ley)</span>';

function mapOrg(org) {
  var l = (org||'').toLowerCase();
  if (l.indexOf('diputados') >= 0 && l.indexOf('naci') >= 0) return 'Camara de Diputados Nacional';
  if ((l.indexOf('senadores') >= 0 || l.indexOf('senado') >= 0) && l.indexOf('naci') >= 0) return 'Camara de Senadores Nacional';
  if (l.indexOf('legislatura') >= 0) return 'Legislatura Provincial';
  if (l.indexOf('diputados') >= 0) return 'Camara de Diputados Provincial';
  return org||'';
}

function buildNav() {

  var right = document.getElementById('nav-right');
  if (!currentUser) { tabs.innerHTML = ''; if (right) right.innerHTML = navFecha(); return; }
  var isAdmin = isResearch(currentUser);
  var h;
  if (isAdmin) {
    // Secuencia temporal del flujo admin: cargar -> revisar -> consolidar.
    var steps = [['adm','Cargar proyectos'],['mgr','Proyectos cargados'],['consolidado','Consolidado']];
    h = '';
    steps.forEach(function(s, i){
      if (i) h += '<span class="nav-chev"><i class="ti ti-chevron-right"></i></span>';
      h += '<div class="nav-tab'+(s[0]==='adm'?' active':'')+'" id="tab-'+s[0]+'" onclick="switchTab(\''+s[0]+'\')"><span class="step-n">'+(i+1)+'</span> '+s[1]+'</div>';

    h = '<div class="nav-tab active" id="tab-mgr" onclick="switchTab(\'mgr\')">Revisión</div>'

      + '<div class="nav-tab" id="tab-lark" onclick="switchTab(\'lark\')">Consolidado TikTok</div>';

  if (right) right.innerHTML = helpMulita() + navFecha()
    + '<span class="nav-user"><i class="ti ti-user-circle"></i>' + esc(managerLabel(currentUser)) + '</span>'
    + '<button class="nav-logout" onclick="logout()">Salir</button>';

// Preferencia de filtros por manager (se recuerda entre sesiones, en este navegador).
function filterPrefsKey() { return 'sd_filters_' + (currentUser || ''); }
function saveFilterPrefs() {
  try {
    if (!document.querySelector('.sec-chk')) return;
    localStorage.setItem(filterPrefsKey(), JSON.stringify({sectors: getActiveSectors(), jurs: getActiveJurs(), ambitos: getActiveAmbitos(), today: onlyToday}));
  } catch(e) {}
}
function applyFilterPrefs() {
  var raw; try { raw = localStorage.getItem(filterPrefsKey()); } catch(e) { return; }
  if (!raw) return;
  var p; try { p = JSON.parse(raw); } catch(e) { return; }
  if (!p) return;
  if (Array.isArray(p.sectors)) document.querySelectorAll('.sec-chk').forEach(function(c){ c.checked = p.sectors.indexOf(c.value) >= 0; });
  // Valores de jur nuevos (paises regionales, sumados 2026-09) que una preferencia guardada
  // ANTES de que existieran no puede haber marcado ni desmarcado a proposito: los dejamos en
  // su default (tildado), no los ocultamos silenciosamente por no estar en el array guardado.
  if (Array.isArray(p.jurs)) document.querySelectorAll('.jur-chk').forEach(function(c){ if (PAISES_REGIONALES.indexOf(c.value) < 0) c.checked = p.jurs.indexOf(c.value) >= 0; });
  // Los valores de Ámbito cambiaron (2026-09-04: Legislativa/Regulatoria -> Proyectos de ley/
  // Alertas de sesión/Boletines oficiales). Una preferencia vieja no matchea NINGUNO de los
  // valores nuevos — si la aplicáramos tal cual, todo quedaría destildado. Igual que con las
  // jurisdicciones regionales: si no matchea nada, la ignoramos y dejamos el default (tildado).
  if (Array.isArray(p.ambitos)) {
    var validAmb = Array.from(document.querySelectorAll('.amb-chk')).map(function(c){ return c.value; });
    var ambStale = p.ambitos.length && !p.ambitos.some(function(v){ return validAmb.indexOf(v) >= 0; });
    if (!ambStale) document.querySelectorAll('.amb-chk').forEach(function(c){ c.checked = p.ambitos.indexOf(c.value) >= 0; });
  }
  onlyToday = !!p.today;
  var ot = document.getElementById('only-today'); if (ot) ot.checked = onlyToday;
  updateSecBtn(); updateJurBtn(); updateAmbBtn();
}

function getActiveSectors() { return Array.from(document.querySelectorAll('.sec-chk:checked')).map(function(c){return c.value;}); }
function getActiveJurs() { return Array.from(document.querySelectorAll('.jur-chk:checked')).map(function(c){return c.value;}); }
function getActiveAmbitos() { return Array.from(document.querySelectorAll('.amb-chk:checked')).map(function(c){return c.value;}); }

function updateSecBtn() { var a=getActiveSectors(),all=document.querySelectorAll('.sec-chk').length,btn=document.getElementById('dd-sec-btn'),ac=document.getElementById('chk-all-sec'); if(!btn)return; if(!a.length){btn.textContent='Ninguno';ac.checked=false;ac.indeterminate=false;} else if(a.length===all){btn.textContent='Todos';ac.checked=true;ac.indeterminate=false;} else{btn.textContent=a.length+' sectores';ac.checked=false;ac.indeterminate=true;} }

function initImp(id) { id=String(id); if (!localImp[id]) { localImp[id]={}; CLIENTS.forEach(function(c){localImp[id][c]='-';}); } }

// Todas las calificaciones de un cliente en un proyecto, ordenadas por antigüedad (más viejo → más nuevo).
// El último es el vigente ("la última corrección gana"). Incluye al usuario actual (vía localImp).
// Un "-" CON timestamp propio es un borrado deliberado: cuenta como corrección y pisa el valor
// anterior. Un "-" SIN timestamp (default / datos viejos) significa "sin calificar" y se ignora.
function clientRatings(pid, client) {
  pid = String(pid); var out = [];
  Object.keys(SELS).forEach(function(m){
    if (m === currentUser) return;
    var e = SELS[m] && SELS[m][pid]; if (!e || !e.impacts) return;
    var v = e.impacts[client];
    var hasTs = !!(e.impTs && e.impTs[client] != null);
    if (v && v !== '-') out.push({name: m, level: v, ts: hasTs ? e.impTs[client] : (e.ts || 0)});
    else if (hasTs) out.push({name: m, level: '-', ts: e.impTs[client]});
  });
  var cv = localImp[pid] && localImp[pid][client];
  var myTs = localImpTs[pid] && localImpTs[pid][client];
  if (cv && cv !== '-') out.push({name: currentUser, level: cv, ts: myTs || 0});
  else if (myTs != null) out.push({name: currentUser, level: '-', ts: myTs});
  out.sort(function(a,b){ return (a.ts||0) - (b.ts||0); });
  return out;
}

function getOtherImpacts(pid) {
  pid = String(pid);
  var results = [];
  Object.keys(SELS).forEach(function(mname) {
    if (mname === currentUser) return;
    var sel = SELS[mname];
    if (!sel[pid]) return;
    var imp = sel[pid].impacts || {};
    CLIENTS.forEach(function(c) { if (imp[c] && imp[c] !== '-') results.push({name: mname, client: c, level: imp[c]}); });
  });
  return results;
}

function impactBadgeStyle(level) {
  if (level === 'Alto') return 'background:#C0392B;color:#fff;';
  if (level === 'Medio') return 'background:#E67E22;color:#fff;';
  if (level === 'Bajo') return 'background:#3B6D11;color:#fff;';
  return 'background:#eee;color:#555;';
}

function cardHTML(p) {
  var id = String(p.id);
  var isExp = !!expanded[id];        // expandida (estado de UI)
  var isRated = !!localSel[id];      // ya calificada (tiene impacto cargado) = "Rotulado"
  var isRead = !!readSet[id] || isRated;  // ya abierta por este usuario = "Leído"
  if (isExp) initImp(id);
  var tema = temaOf(p);
  var otherImps = getOtherImpacts(id);
  var lx = safeUrl(p.linkExpediente), lt = safeUrl(p.linkTexto);
  var nuevo = loadedToday(p);
  var vencido = isOverdue(p);

  var h = '<div class="card'+(isExp?' sel':'')+(isRated&&!isExp?' rated':'')+(isRead&&!isExp?' read':'')+(nuevo?' nuevo':'')+'" onclick="toggleCard(\''+id+'\',event)">';
  if (nuevo) h += '<span class="card-nuevo">Nuevo</span>';
  if (vencido && !isExp) h += '<img class="card-overdue cs-clock" src="calendario.png" alt="Fuera de fecha" title="Fuera de fecha">';
  h += '<div class="chk">'+(isRated?'<i class="ti ti-check" style="font-size:12px;color:#fff"></i>':'')+'</div>';

  // MITAD IZQUIERDA: info del proyecto
  h += '<div class="cinfo">';
  h += '<div class="ctitle">'+tipoIconHTML(p)+esc(p.title)+(isExp?tipoLabelHTML(p):'')+'</div>';
  if (isExp) {
    // EXPANDIDA: todo el detalle
    h += '<div class="cmeta">';
    h += '<span class="pill p-fecha"><i class="ti ti-calendar" style="font-size:10px"></i> '+esc(p.fecha)+'</span>';
    h += '<span class="pill p-num">'+esc(p.num)+'</span>';
    if (tema) h += '<span class="pill p-tema">'+esc(tema)+'</span>';
    h += '<span class="pill p-org">'+esc(mapOrg(p.org))+'</span>';
    if (p.giro) h += '<span class="pill p-org" title="Giro a comisión"><i class="ti ti-arrow-ramp-right" style="font-size:10px"></i> '+esc(p.giro)+'</span>';
    if (lx) h += '<a href="'+lx+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="clink"><i class="ti ti-link" style="font-size:11px"></i> Expediente</a>';
    if (lt) h += '<a href="'+lt+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="clink"><i class="ti ti-file-text" style="font-size:11px"></i> '+esc(linkTextoLabel(p))+'</a>';
    if (!llevaImpacto(p)) h += '<span class="pill" style="background:var(--blue-bg);color:var(--blue-dark)" title="Este ítem no lleva calificación de impacto por cliente"><i class="ti ti-info-circle" style="font-size:10px"></i> Solo informativo</span>';
    h += '</div>';
    if (p.autor) h += '<div class="cautor"><i class="ti ti-user" style="font-size:12px"></i> '+esc(p.autor)+'</div>';
    var prefijo = p.tipo === 'proyecto_ley' ? 'El proyecto de ley tiene por objeto ' : '';
    h += '<div class="cresumen">'+prefijo+esc(p.resumen||'')+'</div>';
    if (isResearch(currentUser)) h += '<button class="admin-del-item" onclick="event.stopPropagation();adminDeleteItem(\''+id+'\')" title="Eliminar este ítem (solo Research)"><i class="ti ti-trash"></i> Eliminar</button>';
  } else {
    // COLAPSADA (hipercolapsada): solo título + tema
    h += '<div class="cmeta-min">';
    if (tema) h += '<span class="pill p-tema">'+esc(tema)+'</span>';
    if (otherImps.length) h += '<span class="others-mark" title="'+otherImps.length+' calificación(es) de otros managers"><i class="ti ti-users" style="font-size:11px"></i> '+otherImps.length+'</span>';
    h += '</div>';
    var parts = '';
    if (isRated) parts += '<span class="cs cs-rot"><i class="ti ti-tag" style="font-size:11px"></i> Rotulado</span>';
    else if (isRead) parts += '<span class="cs cs-leido"><i class="ti ti-check" style="font-size:11px"></i> Leído</span>';
    if (parts) h += '<div class="card-status">'+parts+'</div>';
  }
  h += '</div>'; // cinfo

  // MITAD DERECHA: solo al expandir Y si lleva impacto (si no, no hay nada que poner ahí —
  // dejamos que cinfo ocupe todo el ancho en vez de reservar la columna de impactos vacía).
  // Colapsada: chevron sutil.
  if (isExp && llevaImpacto(p)) {
    h += '<div class="cimpact wide" onclick="event.stopPropagation()">' + renderImp(id) + '</div>';
  } else if (!isExp) {
    h += '<i class="ti ti-chevron-down card-chev"></i>';
  }
  h += '</div>';
  return h;
}

function renderImp(pid) {
  pid = String(pid); initImp(pid);
  var p = projectById(pid);
  var overdue = !!(p && isOverdue(p) && !overrideLate[pid]);   // corte vencido y aún no desbloqueado
  var unlocked = !!(p && isOverdue(p) && overrideLate[pid]);   // vencido pero el usuario lo desbloqueó
  var h = '<div class="impacts-section" onclick="event.stopPropagation()"><div class="impacts-title">Impacto por cliente</div>';
  if (overdue) h += '<div class="late-banner"><span class="late-msg"><img class="cs-clock" src="calendario.png" alt=""> Fuera de fecha</span><button class="late-btn" onclick="unlockLate(\''+pid+'\')">Cargar fuera de fecha</button></div>';
  h += '<div class="impacts-grid">';
  CLIENTS.forEach(function(c) {
    var ratings = clientRatings(pid, c);
    var v = ratings.length ? ratings[ratings.length-1].level : '-';   // vigente = última corrección
    var cls = v==='Alto'?'alto':v==='Medio'?'medio':v==='Bajo'?'bajo':'';
    // Cadena de nombres (ej.: "Carolina - Hernán"). No la muestro si el único que calificó soy yo.
    var byline = '';
    if (ratings.length && !(ratings.length===1 && ratings[0].name===currentUser)) {
      var names = ratings.map(function(r){ return managerLabel(r.name); }).join(' - ');
      byline = '<span class="imp-by" title="'+esc(names)+'">'+esc(names)+'</span>';
    }
    var cj = c.replace(/'/g,"\\'");
    h += '<div class="imp-item"><span class="imp-label" title="'+esc(clientLabel(c))+'">'+esc(clientLabel(c))+'</span><div class="imp-ctrl">';
    if (overdue) {
      // Corte vencido: desplegable gris y anulado.
      h += '<select class="imp-select '+cls+'" disabled>';
      IMPACT.forEach(function(o){ h += '<option'+(v===o?' selected':'')+'>'+o+'</option>'; });
      h += '</select>';
    } else {
      h += '<select class="imp-select '+cls+'" onchange="setImp(\''+pid+'\',\''+cj+'\',this.value);colorSel(this)">';
      IMPACT.forEach(function(o){ h += '<option'+(v===o?' selected':'')+'>'+o+'</option>'; });
      h += '</select>';
    }
    h += byline + '</div></div>';
  });
  h += '</div>';
  if (unlocked) h += '<div class="late-mt"><button class="btn" onclick="copyMtRow(\''+pid+'\')"><i class="ti ti-copy"></i> Copiar fila para el Master Tracker</button><span class="mt-ok" id="mtok-'+pid+'" style="display:none"><i class="ti ti-check"></i> Copiado</span></div>';
  h += '</div>'; return h;
}

function colorSel(el) { el.className = 'imp-select '+(el.value==='Alto'?'alto':el.value==='Medio'?'medio':el.value==='Bajo'?'bajo':''); }
function setImp(pid,client,val) {
  pid=String(pid); initImp(pid); localImp[pid][client]=val;
  if (!localImpTs[pid]) localImpTs[pid]={};
  localImpTs[pid][client]=Date.now();   // sello por cliente: la última corrección gana
  // "Calificado" = tiene al menos un impacto != '-'
  var rated = CLIENTS.some(function(c){ return localImp[pid][c] && localImp[pid][c]!=='-'; });
  if (rated) localSel[pid]=true; else delete localSel[pid];
  updateFinfo(); scheduleSave();
}

function renderList() {
  var aS=getActiveSectors(),aJ=getActiveJurs(),aA=getActiveAmbitos();
  saveFilterPrefs();
  var q = norm(searchQ);
  var f = PROJECTS.filter(function(p){
    if (aS.indexOf(p.sector)<0 || aJ.indexOf(p.jur)<0 || aA.indexOf(ambitoOf(p))<0) return false;
    if (onlyToday && !loadedToday(p)) return false;
    if (filterDate && String(p._d)!==filterDate) return false;
    if (q && norm((p.title||'')+' '+(p.num||'')+' '+(p.resumen||'')+' '+(p.autor||'')+' '+temaOf(p)+' '+(p.org||'')).indexOf(q)<0) return false;
    return true;
  });
  var list = document.getElementById('list'); if (!list) return;
  if (!PROJECTS.length) { list.innerHTML='<div class="empty"><i class="ti ti-inbox" style="font-size:28px;display:block;margin:0 auto 10px"></i>Todavía no hay proyectos cargados.</div>'; return; }
  if (!f.length) { list.innerHTML='<div class="empty"><i class="ti ti-filter-off" style="font-size:28px;display:block;margin:0 auto 10px"></i>No hay proyectos con esos filtros</div>'; return; }

  // Agrupar por la fecha del REPORTE INTERNO (día del snippet que los trajo = _d), no por
  // la fecha de presentación del proyecto.
  function repDate(p){ return p._d ? isoToDisplay(p._d) : (p.fecha || 'Sin fecha'); }
  var groups = {}, groupOrder = [];
  f.forEach(function(p) { var fecha = repDate(p); if (!groups[fecha]) { groups[fecha] = []; groupOrder.push(fecha); } groups[fecha].push(p); });
  groupOrder.sort(function(a,b){ return fechaSortKey(b).localeCompare(fechaSortKey(a)); });

  var DIAS_ES = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function fechaLabel(fecha) {
    if (fecha === 'Sin fecha') return 'Sin fecha';
    var parts = fecha.split('/'); if (parts.length !== 3) return fecha;
    var d = parseInt(parts[0]), m = parseInt(parts[1])-1, y = parseInt(parts[2]);
    var date = new Date(y, m, d); var diaNom = DIAS_ES[date.getDay()]; var mesNom = MESES[m];
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.round((today - date) / 86400000);
    var extra = diff === 0 ? ' — Hoy' : diff === 1 ? ' — Ayer' : '';
    return diaNom + ' ' + d + ' de ' + mesNom + ' de ' + y + extra;
  }

  // Orden de sectores y jurisdicciones incluyendo los buckets de fallback.
  var SEC_ORDER = SECTORES.concat([SECTOR_OTRO]);
  var JUR_FULL = JUR_ORDER.concat([JUR_OTRA]);

  // Total sin leer = ni abiertos ni calificados por este usuario, sobre el set filtrado.
  var unread = f.filter(function(p){ var id=String(p.id); return !readSet[id] && !localSel[id]; }).length;

  var h = '';
  groupOrder.forEach(function(fecha, gi) {
    var ps = groups[fecha];
    h += '<div style="margin-bottom:1.5rem">';
    h += '<div style="font-size:14px;font-weight:600;color:var(--text);padding:10px 0 8px;border-bottom:2px solid var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:8px">';
    h += '<i class="ti ti-calendar" style="color:var(--blue);font-size:16px"></i>'+esc(fecha==='Sin fecha'?'Sin fecha de reporte':('Reportados el '+fechaLabel(fecha)));
    var rightCol = '';
    if (fecha === todayStr()) rightCol += '<span class="hoy-nuevos">Hoy hay '+ps.length+' proyecto'+(ps.length!==1?'s':'')+' nuevo'+(ps.length!==1?'s':'')+'</span>';
    if (gi === 0) rightCol += '<span class="sin-leer">'+unread+' sin leer</span>';
    if (rightCol) h += '<span style="margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1.2">'+rightCol+'</span>';
    h += '</div>';
    if (allSecSelected()) {
      SEC_ORDER.forEach(function(sec) {
        var sp = ps.filter(function(p){return p.sector===sec;}); if (!sp.length) return;
        h += '<div class="group-sector-title" style="margin-top:8px">'+esc(sec)+'</div>';
        JUR_FULL.forEach(function(jur){ var jp=sp.filter(function(p){return p.jur===jur;}); if(!jp.length)return; h+='<div class="group-jur-title">'+esc(jurLabel(jur))+'</div><div class="group-jur-cards">'+jp.map(cardHTML).join('')+'</div>'; });
      });
    } else {
      h += '<div class="group-jur-cards">'+ps.map(cardHTML).join('')+'</div>';
    }
    h += '</div>';
  });
  list.innerHTML = h;
}

async function changeDate(iso) {
  if (!iso) return;
  viewDate = iso;
  showOverlay('Cargando...');
  try { PROJECTS = await dbGetProjects(iso); SELS = await dbGetSelections(iso); }
  catch(e) { hideOverlay(); return; }
  loadLocalFromSels();
  hideOverlay();
  renderList(); updateFinfo(); updateTodayLegend();
}

// Guardado automático (con debounce) cada vez que el manager cambia algo.
function setSaveStatus(state) {
  var el=document.getElementById('save-status'); if(!el) return;
  if(state==='saving') el.innerHTML='<i class="ti ti-loader-2 spin-sm"></i> Guardando…';
  else if(state==='saved') el.innerHTML='<i class="ti ti-cloud-check"></i> Guardado';
  else if(state==='error') el.innerHTML='<i class="ti ti-alert-triangle"></i> Error al guardar';
  else el.innerHTML='<i class="ti ti-cloud"></i> Se guarda automáticamente';
  el.className='save-status'+(state==='error'?' err':(state==='saved'?' ok':''));
}
function scheduleSave() { setSaveStatus('saving'); clearTimeout(saveTimer); saveTimer=setTimeout(commitSave, 600); }
function commitSave() {
  // Guarda los proyectos rotulados Y los que solo tienen borrados deliberados (impTs sin valores),
  // para que "corregir a -" también persista y pueda pisar la calificación de otro manager.
  var pids={};
  Object.keys(localSel).forEach(function(pid){ pids[pid]=1; });
  Object.keys(localImpTs).forEach(function(pid){ if (Object.keys(localImpTs[pid]||{}).length) pids[pid]=1; });
  var sd={}; Object.keys(pids).forEach(function(pid){ sd[pid]={impacts:localImp[pid]||{}, impTs:localImpTs[pid]||{}, ts:Date.now()}; });
  SELS[currentUser]=sd;
  dbSaveSelectionAll(currentUser,sd).then(function(){ setSaveStatus('saved'); }).catch(function(){ setSaveStatus('error'); });
}

/* ============================================================
   VISTA CONSOLIDADO (admin) — por día
   ============================================================ */
async function renderConsolidado(container) {
  var _tok = ++renderSeq;
  showOverlay('Cargando consolidado...');
  var ps = [], ss = {};
  try { ps = await dbGetProjects(viewDate); } catch(e) {}
  try { ss = await dbGetAllSelections(); } catch(e) {}
  if (_tok !== renderSeq) return;
  PROJECTS = ps; SELS = ss;
  hideOverlay();
  var dayIds={}; PROJECTS.forEach(function(p){ dayIds[String(p.id)]=1; });
  // ¿el manager tiene algún impacto propio != '-' en este proyecto? (un borrado solo no cuenta)
  function mgrRated(m,pid){ var e=SELS[m][pid]; return !!(e&&e.impacts&&CLIENTS.some(function(c){return e.impacts[c]&&e.impacts[c]!=='-';})); }
  // solo managers con alguna calificación real entre los proyectos de este día
  var mns=Object.keys(SELS).filter(function(m){ return Object.keys(SELS[m]).some(function(pid){ return dayIds[pid] && mgrRated(m,pid); }); });
  var selPids={}; mns.forEach(function(m){Object.keys(SELS[m]).forEach(function(pid){ if(dayIds[pid]) selPids[String(pid)]=true;});});
  // Al export van solo los proyectos con al menos un impacto EFECTIVO != '-' (si borraron todas
  // sus calificaciones, no debe llegar al Master Tracker).
  var mergedAll = mergeImpacts(Object.keys(selPids), SELS);
  var sp=PROJECTS.filter(function(p){ var mi=mergedAll[String(p.id)]; return mi && CLIENTS.some(function(c){return mi[c]&&mi[c]!=='-';}); });
  // Split para el Master Tracker: PL regionales (Chile/Uruguay/Paraguay, hoy a cargo de Eri)
  // aparte de nacionales+provinciales (Argentina, hoy a cargo de Cami) — dos tablas, dos
  // responsables, sin que ninguna dependa de la otra para poder cargar la suya.
  var spRegional = sp.filter(function(p){ return PAISES_REGIONALES.indexOf(p.jur) >= 0; });
  var spNacional = sp.filter(function(p){ return PAISES_REGIONALES.indexOf(p.jur) < 0; });
  var h='<div class="admin-body">';
  h+='<div class="m-date" style="justify-content:flex-end;margin-bottom:12px"><label for="cons-date">Día</label><input type="date" id="cons-date" value="'+viewDate+'" max="'+isoToday()+'" onchange="consolidadoChangeDate(this.value)"></div>';

// Consolida tomando la ÚLTIMA corrección (mayor timestamp por cliente) entre todos los managers.
// Un "-" con timestamp propio es un borrado deliberado y también compite (puede ganar y anular).
function mergeImpacts(pids,sels) {
  var merged={};
  pids.forEach(function(pid){ pid=String(pid); merged[pid]={};
    CLIENTS.forEach(function(c){
      var best='-', bestTs=-1;
      Object.values(sels).forEach(function(sel){
        var e=sel[pid]; if(!e||!e.impacts) return;
        var v=e.impacts[c];
        var hasTs=!!(e.impTs&&e.impTs[c]!=null);
        if((!v||v==='-')&&!hasTs) return;   // sin calificación ni borrado deliberado
        var ts=hasTs?e.impTs[c]:(e.ts||0);
        if(ts>=bestTs){ bestTs=ts; best=(v&&v!=='-')?v:'-'; }
      });
      merged[pid][c]=best;
    });
  });
  return merged;
}

// Genera filas tabuladas alineadas a las columnas del Master Tracker 2.0 (Sheet1):
// 1 Número oficial · 2 Link expediente · 3 Fecha presentación · 4 Fecha últ. act. (Quipu) ·
// 5 Jurisdiccion · 6 Subjurisdicción · 7 Autor · 8 Sector · 9 Clientes afectados · 10 Tema ·
// 11 Sumario · 12 Resumen · 13 Texto · 14 Organismo · 15 Prob. aprobación · 16 Estado ·
// 17 Último movimiento · 18 Fecha últ. movimiento · 19-34 Impacto por cliente.
function buildRows(projects,sels) {
  var hoy=todayStr(); var merged=mergeImpacts(projects.map(function(p){return String(p.id);}),sels);
  // resumen_sesion no lleva impacto ni tracking de estado: no entra al Master Tracker.
  return projects.filter(function(p){ return llevaImpacto(p); }).map(function(p){
    var imp=merged[String(p.id)]||{};
    var ca=CLIENTS.filter(function(c){return imp[c]&&imp[c]!=='-';}).map(clientLabel).join(', ')||'';
    var tipo = canonTipo(p.tipo);
    var esPais = PAISES_REGIONALES.indexOf(p.jur) >= 0;
    var pais = esPais ? p.jur : 'Argentina', subjur = esPais ? '' : p.jur;
    // Estado (col P) / Último movimiento (Q): solo tienen sentido para un proyecto de ley
    // (giro a comisión). Una norma ya está vigente, no tiene ese ciclo.
    var giro=(p.giro&&String(p.giro).trim())||'';
    var sumario = tipo==='proyecto_ley' ? ('El proyecto de ley tiene por objeto '+(p.resumen||'')) : (p.resumen||'');
    var estado = tipo==='proyecto_ley' ? (giro?'Girado a comisión':'Sin giro') : 'Norma vigente';
    var ultMov = tipo==='proyecto_ley' ? (giro?('Girado a comisión ('+giro+')'):'') : '';
    var base=[
      p.num, p.linkExpediente||'', p.fecha, hoy, pais, subjur, p.autor||'', p.sector, ca,
      temaOf(p), (p.title||'').toUpperCase(), sumario,
      p.linkTexto||'', mapOrg(p.org), '', estado, ultMov, p.fecha
    ];
    var impacts=SHEET_IMPACT_COLS.map(function(x){return imp[x.key]||'-';});
    return base.concat(impacts).join('\t');
  }).join('\n');
}

// grupo: 'nacional' o 'regional'. Recalcula el mismo split que la vista previa (misma regla de
// impacto efectivo != '-') para que lo que se copia sea exactamente lo que se mostró arriba.
function copyConsolidado(grupo) {
  var selPids={}; Object.values(SELS).forEach(function(sel){Object.keys(sel).forEach(function(pid){selPids[String(pid)]=true;});});
  var mergedAll = mergeImpacts(Object.keys(selPids), SELS);
  var sp=PROJECTS.filter(function(p){ var mi=mergedAll[String(p.id)]; return mi && CLIENTS.some(function(c){return mi[c]&&mi[c]!=='-';}); });
  sp = sp.filter(function(p){ var esRegional = PAISES_REGIONALES.indexOf(p.jur) >= 0; return grupo==='regional' ? esRegional : !esRegional; });
  if(!sp.length) return;
  var rows=buildRows(sp,SELS);
  var showOk=function(){var ok=document.getElementById('copy-ok-'+grupo);if(ok){ok.style.display='inline';setTimeout(function(){ok.style.display='none';},2200);}};
  try{navigator.clipboard.writeText(rows).then(showOk).catch(function(){fallbackCopy(rows,showOk);});}catch(e){fallbackCopy(rows,showOk);}
}

function fallbackCopy(text,cb) {
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');if(cb)cb();}catch(e){alert('Copia manual: Ctrl+A, Ctrl+C en el preview');}
  document.body.removeChild(ta);
}

/* ============================================================
   CONSOLIDADO TIKTOK → LARK (vista de LARK_USERS) — por rango de fechas
   Genera las dos tablas del Legislative Tracking de Lark: una para
   impacto Alto+Medio (pestaña principal) y otra para Bajo.

// Columnas de la tabla "PLs" de Lark, en orden:
// 1 Bill (link) · 2 Update date · 3 Proposed changes · 4 Business Impact ·
// 5 Likelihood of Approval · 6 Status · 7 Notes · 8 Legal Analysis/ALAI ·
// 9 Internal Contacts · 10 Date of presentation · 11 National/provincial ·
// 12 Home Chamber · 13 Project number · 14 Legislator · 15 Topic ·
// 16 Parent items · 17 Field 1
var LARK_IMPACT = {Alto:'High', Medio:'Normal', Bajo:'Low'};
// Tema de la app -> lista fija de Topics de la skill de Lark (solo los mapeos seguros;
// lo que no está acá sale con el tema en español y lo ajusta la skill de Claude).
var LARK_TOPIC_MAP = {
  'datos personales':'Data protection / Personal Data',
  'inteligencia artificial':'AI',
  'grooming':'Grooming',
  'redes sociales':'Social Media',
  'ciberbullying':'Cyberbullying',
  'cyberbullying':'Cyberbullying',
  'plataformas digitales':'Audiovisual / Digital platforms',
  'educacion':'Education / Digital Education',
  'juego online':'Online gambling',
  'juegos de azar':'Online gambling',
  'ludopatia':'Online gambling',
  'violencia digital':'Digital Violence (women)',
  'influencers':'Influencers regulation',
  'datos biometricos':'Biometric Data',
  'ciberseguridad':'Cyberprotection / Digital security',
  'contenido ilegal':'Illegal Content / Content moderation',
  'acceso a la informacion':'Access to Information',
  'uso de celulares':'Use of cell phones',
  'proteccion al consumidor':'Consumer protection',
  'defensa del consumidor':'Consumer protection',
  'entornos digitales':'Digital Care / Digital Environments',
  'abuso infantil':'Child Abuse / Child Safety',
  'proteccion infantil':'Child Abuse / Child Safety'
};
function larkTopic(p) { var t=temaOf(p); return LARK_TOPIC_MAP[norm(t)] || t; }
// DD/MM/YYYY -> YYYY-MM-DD (formato de fecha del tracker de Lark y de la skill).
function larkDate(f) { if(!f||f.indexOf('/')<0) return f||''; var p=f.split('/'); return p[2]+'-'+p[1]+'-'+p[0]; }
// Notes de Lark: "Submitted to Committees | Project presented by [bloque]".
// El bloque/partido sale de los paréntesis del campo autor.
function larkNotes(autor) {
  var parties=[], seen={}, m, re=/\(([^)]+)\)/g;
  while ((m=re.exec(autor||''))) { var x=m[1].trim(); if(x&&!seen[norm(x)]){seen[norm(x)]=1;parties.push(x);} }
  return 'Submitted to Committees'+(parties.length?' | Project presented by '+parties.join(' / '):'');
}
function larkJur(j) {
  if (j==='Nacional') return 'National';
  if (j==='CABA') return 'City of Buenos Aires';
  if (j==='Buenos Aires') return 'Buenos Aires Province';
  return j||'';
}
function larkChamber(org) {
  var l=(org||'').toLowerCase();
  if (l.indexOf('senad')>=0) return 'Senate';
  if (l.indexOf('diputados')>=0 && l.indexOf('naci')>=0) return 'Deputies';
  if (l.indexOf('diputados')>=0) return 'Provincial Deputies';
  if (l.indexOf('legislatura')>=0) return 'Provincial Legislature';
  return '';
}
// Convenciones alineadas a la skill de Lark: Update date = día del export, fechas
// YYYY-MM-DD, Notes autoarmado, Status "In progress" (recién reportados = en trámite).
// Likelihood, Legal Analysis y Contacts van vacíos (los completa la skill o quien carga).
function larkCells(p, level) {
  return [
    p.title||'', isoToday(), p.resumen||'', LARK_IMPACT[level]||level, '', 'In progress', larkNotes(p.autor), '', '',
    larkDate(p.fecha), larkJur(p.jur), larkChamber(p.org), p.num||'', p.autor||'', larkTopic(p), '', ''
  ];
}
function larkRowsTSV(items) { return items.map(function(x){ return larkCells(x.p,x.level).join('\t'); }).join('\n'); }
// Variante HTML del portapapeles: "Bill (link)" pega con hipervínculo al texto del proyecto.
function larkRowsHTML(items) {
  return '<table>'+items.map(function(x){
    var cells=larkCells(x.p,x.level);
    var url=safeUrl(x.p.linkTexto)||safeUrl(x.p.linkExpediente);
    var first=url?'<a href="'+url+'">'+esc(cells[0])+'</a>':esc(cells[0]);
    return '<tr><td>'+first+'</td>'+cells.slice(1).map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';
  }).join('')+'</table>';
}

var larkFrom='', larkTo='', larkHigh=[], larkLow=[];
// Memoria del último export (por usuario, en este navegador): el próximo rango arranca
// el día siguiente al último "Hasta" copiado, para no duplicar ni saltear días en Lark.
function larkLastKey() { return 'sd_lark_last_'+(currentUser||''); }
function saveLarkLast() { try { localStorage.setItem(larkLastKey(), JSON.stringify({to:larkTo, at:Date.now()})); } catch(e) {} }
function getLarkLast() { try { return JSON.parse(localStorage.getItem(larkLastKey())||'null'); } catch(e) { return null; } }
function isoAddDays(iso,n) { var p=iso.split('-'); var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])+n); var z=function(x){return (x<10?'0':'')+x;}; return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }

async function renderLark(container) {
  var _tok = ++renderSeq;
  showOverlay('Cargando consolidado TikTok...');

  hideOverlay();

    var last = getLarkLast();
    larkFrom = (last && last.to) ? isoAddDays(last.to,1) : isoAddDays(isoToday(),-6);
    if (larkFrom > larkTo) larkFrom = larkTo;
  }
  // Proyectos reportados dentro del rango (por _d, el día del snippet) con impacto
  // TikTok vigente (última corrección gana, igual que el consolidado del tracker).
  var inRange = PROJECTS.filter(function(p){ return p._d && p._d>=larkFrom && p._d<=larkTo; });
  var merged = mergeImpacts(inRange.map(function(p){return String(p.id);}), SELS);
  larkHigh=[]; larkLow=[];
  inRange.forEach(function(p){
    var v=(merged[String(p.id)]||{})[LARK_CLIENT];
    if (v==='Alto'||v==='Medio') larkHigh.push({p:p,level:v});

      +'<span id="lark-ok-'+group+'" style="font-size:12px;color:var(--green);display:none"><i class="ti ti-check"></i> Copiado!</span>'
      +'<button class="btn" onclick="copyLarkPrompt(\''+group+'\')" title="Copia las filas con un prompt para pegar en Claude: traduce, pone el título temático y arma el Excel"><i class="ti ti-prompt"></i> Copiar para Claude (Excel en inglés)</button>'
      +'<span id="lark-okp-'+group+'" style="font-size:12px;color:var(--green);display:none"><i class="ti ti-check"></i> Copiado!</span></div>';
    h+='<div class="cprev">'+esc(items.map(function(x){

      return [c[0].slice(0,60), c[9], c[3], c[12]].join(' | ')+' | ...';

    return h;
  }

  var last = getLarkLast();
  var h='<div class="admin-body">';
  h+='<div class="m-date" style="justify-content:flex-end;gap:10px;margin-bottom:12px">'
    +'<label for="lark-from">Reportados desde</label><input type="date" id="lark-from" value="'+larkFrom+'" max="'+isoToday()+'" onchange="larkChangeRange()">'
    +'<label for="lark-to">hasta</label><input type="date" id="lark-to" value="'+larkTo+'" max="'+isoToday()+'" onchange="larkChangeRange()"></div>';
  h+='<div class="admin-card"><div class="admin-card-title">'+MULITA_ICON+' Consolidado TikTok para Lark</div>';
  h+='<div class="admin-card-sub">Proyectos reportados entre el '+esc(isoToDisplay(larkFrom))+' y el '+esc(isoToDisplay(larkTo))
    +' con impacto TikTok cargado (vale la última corrección entre managers), en las columnas del Legislative Tracking de Lark.'
    +(last&&last.to?' <b>Último export: hasta el '+esc(isoToDisplay(last.to))+'</b> — el rango arranca donde dejaste.':'')
    +'<br><b>Copiar para Lark</b> pega directo en la pestaña que corresponda (título y resumen en español; el link viaja dentro del título).'
    +'<br><b>Copiar para Claude (Excel en inglés)</b> copia las filas con un prompt para pegar en Claude: tu skill del Lark Tracker traduce el resumen, pone el título temático, completa Likelihood y genera el Excel — sin tocar el impacto que ya calificó el equipo.</div>';

  h+=larkCard('Impacto Bajo', 'Para la pestaña de impacto bajo (Low).', larkLow, 'low');
  h+='</div>'; container.innerHTML=h;
}

async function copyLark(group) {
  var items = group==='high' ? larkHigh : larkLow; if (!items.length) return;
  var tsv=larkRowsTSV(items), html=larkRowsHTML(items);
  var ok=function(){ var e=document.getElementById('lark-ok-'+group); if(e){e.style.display='inline';setTimeout(function(){e.style.display='none';},2200);} saveLarkLast(); };
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/plain': new Blob([tsv],{type:'text/plain'}),
      'text/html': new Blob([html],{type:'text/html'})
    })]);
    ok();
  } catch(e) {
    try { navigator.clipboard.writeText(tsv).then(ok).catch(function(){ fallbackCopy(tsv,ok); }); } catch(e2) { fallbackCopy(tsv,ok); }
  }
}

// Copia las filas + un prompt para la skill de Claude "Lark Legislative Tracker":
// la skill traduce el resumen, pone el título temático y completa Likelihood,
// SIN tocar el Business Impact que ya calificó el equipo.
function copyLarkPrompt(group) {
  var items = group==='high' ? larkHigh : larkLow; if (!items.length) return;
  var tsv = items.map(function(x){
    var url = safeUrl(x.p.linkTexto)||safeUrl(x.p.linkExpediente);
    return larkCells(x.p,x.level).concat([url]).join('\t');
  }).join('\n');
  var prompt =
    'Usá la skill del Lark Legislative Tracker (Argentina) para terminar de preparar estas filas y generar el Excel.\n\n'
    + 'Las filas ya vienen en el orden exacto de las 17 columnas del tracker, separadas por TAB, más una columna extra al final con el link al texto del proyecto.\n\n'
    + 'Reglas (pisan cualquier criterio propio de la skill):\n'
    + '- NO cambies: Business Impact (ya lo calificó el equipo en la app), Project number, Legislator, Date of presentation, Update date ni Status.\n'
    + '- Traducí Proposed changes al inglés (2-4 oraciones, neutras y factuales).\n'
    + '- Reemplazá Bill (link) por el título temático corto en inglés según la guía de la skill, y usá la columna extra del final como hipervínculo de esa celda. NO incluyas la columna extra en el Excel.\n'
    + '- Completá Likelihood of Approval (High/Normal/Low) según los criterios de la skill.\n'
    + '- Topic: si ya viene en inglés de la lista fija, dejalo; si viene en español o vacío, elegí el de la lista.\n'
    + '- Notes ya viene armado; ajustalo solo si falta el bloque.\n\n'
    + 'FILAS:\n' + tsv;
  var ok=function(){ var e=document.getElementById('lark-okp-'+group); if(e){e.style.display='inline';setTimeout(function(){e.style.display='none';},2200);} saveLarkLast(); };
  try { navigator.clipboard.writeText(prompt).then(ok).catch(function(){ fallbackCopy(prompt,ok); }); } catch(e) { fallbackCopy(prompt,ok); }
}

/* ============================================================

  h+='<div class="field-grid full"><div class="field"><label>JSON de proyectos</label><textarea id="json-text" style="min-height:160px;font-size:12px;font-family:monospace" placeholder=\'[{"num":"1234-D-2026","sector":"Tecnologia","jur":"Nacional",...}]\'></textarea></div></div>';
