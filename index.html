<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Snippet</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F4F3EF;--surface:#FFFFFF;--border:#DDD9D2;--border-light:#E9E6DF;--text:#2C2C2A;--text2:#5F5E5A;--text3:#888780;--blue:#395279;--blue-bg:#E8EEF5;--blue-dark:#2D4060;--accent:#C0714D;--accent-bg:#FDF5F0;--accent-border:#E8C4A8;--green-bg:#EAF3DE;--green:#3B6D11;--green-border:#639922;--orange-bg:#FAEEDA;--orange:#633806;--orange-border:#EF9F27;--red-bg:#FCEBEB;--red:#791F1F;--red-border:#F09595;--yellow-bg:#FEF3E2;--yellow:#7A4A00;--radius:6px;--radius-lg:8px;}
body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{display:flex;align-items:center;background:var(--blue);border-bottom:2px solid var(--accent);padding:0 1.25rem;height:48px}
.nav-logo{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-right:24px;display:flex;align-items:center;gap:7px;color:#fff}
.nav-logo span{color:var(--accent)}
#nav-tabs{display:flex;align-items:center;height:48px}
.nav-tab{display:flex;align-items:center;gap:6px;padding:0 14px;height:48px;font-size:12px;font-weight:500;letter-spacing:.02em;color:#CBD7E6;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;opacity:.6;transition:opacity .15s}
.nav-tab:hover{opacity:.9}
.nav-tab.active{color:#fff;border-bottom-color:var(--accent);font-weight:700;opacity:1}
.step-n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.18);color:#CBD7E6;font-size:10px;font-weight:700}
.nav-tab.active .step-n{background:var(--accent);color:#fff}
.nav-chev{display:flex;align-items:center;color:#7E93B0;opacity:.7;font-size:15px;padding:0 1px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.nav-fecha{font-size:11px;color:#A8BCD4;text-transform:capitalize;font-weight:300}
.nav-user{display:flex;align-items:center;gap:6px;font-size:12px;color:#E8EEF5;font-weight:600}
.nav-user i{font-size:17px;color:var(--accent)}
.nav-logout{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 12px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.28);background:transparent;color:#CBD7E6;cursor:pointer}
.nav-logout:hover{border-color:var(--accent);color:#fff;background:var(--accent)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 48px);padding:2rem}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;width:100%;max-width:380px}
.login-title{font-size:18px;font-weight:800;letter-spacing:.01em;margin-bottom:4px}
.lg-group-title i{font-size:13px}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:1.5rem}
.login-opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;margin-bottom:6px;background:var(--surface)}
.login-opt:last-child{margin-bottom:0}
.login-opt i{font-size:20px}
.login-opt strong{font-size:13px;display:block}
.login-opt span{font-size:11px;color:var(--text3)}
.lg-group{border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:14px}
.lg-group-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.lg-research{background:var(--blue-bg);border-color:#C3D2E6}
.lg-research .lg-group-title{color:var(--blue)}
.lg-research .login-opt i{color:var(--blue)}
.lg-research .login-opt:hover{border-color:var(--blue);background:#F2F6FB}
.lg-pa{background:var(--accent-bg);border-color:var(--accent-border)}

.login-foot{text-align:center;margin-top:14px;font-size:11px;color:var(--text3)}

.gate-input{width:100%;font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);outline:none;margin-bottom:10px}

.m-hdr{display:flex;align-items:center;gap:10px;padding:.9rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}

.m-date{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}

.dd-item:hover{background:var(--bg)}

.list{padding:1.75rem 2rem;display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto;width:100%}
.group-sector-title{font-size:13px;font-weight:700;color:var(--text);padding:14px 0 8px;margin-bottom:6px}

.group-jur-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.card{border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;background:var(--surface);cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:border-color .12s,box-shadow .12s}

.cinfo{flex:1;min-width:0}
.ctitle{font-size:16px;font-weight:600;line-height:1.4}

.cmeta-min{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}

.p-tema{background:var(--accent-bg);color:var(--accent);border:0.5px solid var(--accent-border)}
.cresumen{font-size:14px;color:var(--text2);line-height:1.55}
.impacts-section{margin-top:0}
.impacts-title{font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}

.imp-item{display:flex;align-items:center;gap:8px;min-width:0}

.imp-select{font-size:11px;height:24px;padding:0 4px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);flex-shrink:0;min-width:62px}

.cimpact{flex-shrink:0;border-left:1px solid var(--border-light);padding-left:14px;min-width:140px;max-width:180px}
.cimpact.wide{flex:0 0 46%;max-width:46%;min-width:400px}
.other-imps{margin-bottom:12px}
.other-imps-t{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.other-imp-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.other-imp-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;flex-shrink:0}
.other-imp-name{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer{padding:1rem 1.25rem;border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0}
.footer-top{display:flex;align-items:center;justify-content:space-between}
.footer-info{font-size:13px;color:var(--text2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-top:10px}
.alert.success{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.alert.error{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}
.alert.info{background:var(--blue-bg);border:1px solid var(--blue);color:var(--blue-dark)}
.admin-body{padding:1.5rem;max-width:960px;margin:0 auto}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.25rem}
.admin-card-title{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.admin-card-sub{font-size:12px;color:var(--text3);margin-bottom:1rem}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field-grid.full{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:500;color:var(--text2)}
.field input,.field select,.field textarea{font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.pi-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);font-size:13px;margin-bottom:8px}
.pi-num{background:var(--blue-bg);color:var(--blue-dark);font-size:11px;padding:2px 7px;border-radius:var(--radius);font-weight:500;white-space:nowrap}
.pi-title{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-jur{font-size:11px;color:var(--text3);white-space:nowrap}
.pi-del{padding:4px 8px;font-size:12px;border-radius:var(--radius);border:1px solid var(--red-border);background:var(--red-bg);color:var(--red);cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center}
.overlay.show{display:flex}
.overlay-box{background:var(--surface);border-radius:var(--radius-lg);padding:2rem;text-align:center;max-width:320px}
.spin{font-size:36px;color:var(--blue);display:block;margin-bottom:12px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mgr-card{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:12px}
.mgr-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.mgr-name{font-size:13px;font-weight:600;flex:1}
.mgr-count{font-size:11px;color:var(--text3)}

.mgr-projs{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.mgr-proj{display:flex;align-items:center;gap:8px;font-size:12px}

.mgr-imps{display:flex;gap:4px;flex-wrap:wrap}
.mgr-imp{font-size:10px;padding:1px 5px;border-radius:var(--radius)}
.mgr-imp.alto{background:var(--green-bg);color:var(--green)}
.mgr-imp.medio{background:var(--orange-bg);color:var(--orange)}

<script>
/* ============================================================
   CONFIGURACION
   ============================================================ */
var SB_URL  = 'https://xyqmtqsczscdejcwusce.supabase.co';
// Clave PUBLICA (anon/publishable) de Supabase.
var SB_ANON = 'sb_publishable_LHaQlBOrhJ5CRyISMiuXhg_0s6Unaxf';

// >>> Contraseña compartida del equipo. CAMBIALA por la que quieras y compartila solo
//     con el equipo. Es un control liviano: la clave viaja en el HTML, así que sirve
//     para que la app no quede a la vista de cualquiera que caiga de casualidad, no
//     como seguridad fuerte. La URL se comparte solo dentro del equipo.
var TEAM_PASSWORD = 'bachacero';

/* ============================================================
   GATE (contraseña del equipo, lado cliente)
   ============================================================ */
function gatePassed() { try { return localStorage.getItem('sd_gate') === '1'; } catch(e) { return false; } }
function setGatePassed(v) { try { if (v) localStorage.setItem('sd_gate','1'); else localStorage.removeItem('sd_gate'); } catch(e) {} }

/* ============================================================
   CAPA SUPABASE (REST)
   ============================================================ */
async function sbFetch(path, method, body) {
  var opts = {method: method || 'GET', headers: {'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON, 'Content-Type': 'application/json', 'Prefer': 'return=representation'}};
  if (body) opts.body = JSON.stringify(body);
  var r = await fetch(SB_URL + '/rest/v1/' + path, opts);
  var t = await r.text();
  if (!r.ok) throw new Error('DB ' + r.status + (t ? ': ' + t.slice(0, 120) : ''));
  return t ? JSON.parse(t) : null;
}

// Proyectos de UNA fecha (ISO). Cada fila projects = {date, data:[...proyectos]}.
async function dbGetProjects(d) {
  try { var r = await sbFetch('projects?date=eq.' + d + '&select=data'); return normalizeProjects((r && r[0] && r[0].data) || []); }
  catch(e) { return []; }
}
// Todos los proyectos de todas las fechas (para vistas globales).
async function dbGetAllProjects() {
  try {
    var r = await sbFetch('projects?select=date,data&order=date.desc');
    var all = [];
    (r || []).forEach(function(row){ (row.data || []).forEach(function(p){ all.push(p); }); });
    all = normalizeProjects(all);
    all.sort(function(a,b){ return fechaSortKey(b.fecha).localeCompare(fechaSortKey(a.fecha)); });
    return all;
  } catch(e) { return []; }
}
// Reemplaza la fila de UNA fecha con la lista dada (solo proyectos de esa fecha).
async function dbSaveProjects(d, ps) {
  await sbFetch('projects?date=eq.' + d, 'DELETE');
  if (ps.length) await sbFetch('projects', 'POST', {id: Date.now(), date: d, data: ps});
}
// Selecciones de UNA fecha: {manager: data}.
async function dbGetSelections(d) {
  try { var r = await sbFetch('selections?date=eq.' + d + '&select=manager,data'); var o = {}; (r || []).forEach(function(x){ o[x.manager] = x.data; }); return o; }
  catch(e) { return {}; }
}
async function dbSaveSelection(d, m, data) {
  await sbFetch('selections?date=eq.' + d + '&manager=eq.' + encodeURIComponent(m), 'DELETE');
  await sbFetch('selections', 'POST', {date: d, manager: m, data: data, updated_at: new Date().toISOString()});
}

/* ============================================================
   CONSTANTES DE NEGOCIO
   ============================================================ */
var SECTORES = ['Coyuntura general','Consumo masivo','Medios de pago','Tecnologia','Automotriz','Agroindustria','Petroquimicos','Mineria','Turismo','Salud','Ambiente'];
var PROVINCIAS = ['CABA','Buenos Aires','Catamarca','Chaco','Chubut','Cordoba','Corrientes','Entre Rios','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquen','Rio Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego','Tucuman'];
var JUR_ORDER = ['Nacional'].concat(PROVINCIAS).concat(['Municipal']);
var CLIENTS = ['Amazon (sector)','Amazon (grado)','AMEX','Coca','Kenvue','Spotify','AWS','TikTok','Roblox','Syngenta','Syngenta pos/neg/neutro','Airbnb','World','Tetrapak','Sanofi','Rio Tinto'];
var IMPACT = ['-','Alto','Medio','Bajo','N/A'];
var RESEARCH = ['Camila (admin)','Victoria','Lucas Sammartino','Lucas MS'];
var PUBLIC_AFFAIRS = ['Carolina','Chiara','Hernan','Felicitas','Erika','Ana','Agustina','Milagros','Nicolás'];
var MANAGERS = RESEARCH.concat(PUBLIC_AFFAIRS);
function isResearch(name) { return RESEARCH.indexOf(name) >= 0; }
var TEMAS = [{tema:'Datos personales',keys:['dato personal','privacidad']},{tema:'Inteligencia artificial',keys:['inteligencia artificial','algoritm']},{tema:'Grooming',keys:['grooming']},{tema:'Plataformas digitales',keys:['plataforma digital']},{tema:'Derechos laborales',keys:['laboral','trabajador']},{tema:'Redes Sociales',keys:['red social','redes sociales']},{tema:'Educacion',keys:['educati','escolar','escuela']},{tema:'Impuestos',keys:['fiscal','tributari','impuesto']},{tema:'Ambiental',keys:['ambiental','residuo']},{tema:'Medicamentos',keys:['medicamento','farmaco']},{tema:'Biocombustibles',keys:['biocombustible','hidrocarburo']},{tema:'Litio',keys:['litio']},{tema:'Semillas',keys:['semilla']},{tema:'Turismo',keys:['turismo']},{tema:'Lobby',keys:['lobby','cabildeo']},{tema:'Salud mental',keys:['suicida','salud mental']},{tema:'Restricciones comerciales',keys:['exportacion','arancel']}];

// Buckets de fallback para que nada desaparezca de los filtros.
var SECTOR_OTRO = 'Otros', JUR_OTRA = 'Otras';
var SECTOR_FILTER = SECTORES.concat([SECTOR_OTRO]);

var PROJECTS = [], SELS = {}, currentUser = null, viewDate = '', localSel = {}, localImp = {};
var _idSeq = 0;

/* ============================================================
   UTILIDADES
   ============================================================ */
function isoToday() {
  var d = new Date(), p = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function isoToDisplay(iso) { if (!iso) return ''; var p = iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function todayStr() { return isoToDisplay(isoToday()); }
function fechaSortKey(f) { return (f && f.indexOf('/')>=0) ? f.split('/').reverse().join('') : ''; }
function newId() { return String(Date.now()) + String(1000 + (_idSeq++ % 9000)); }
function showOverlay(msg, sub) { document.getElementById('overlay').classList.add('show'); document.getElementById('overlay-msg').textContent = msg; document.getElementById('overlay-sub').textContent = sub||''; }
function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }

// Escapa texto para insertar en HTML (evita romper el render / XSS).
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// URL segura para usar en href (solo http/https).
function safeUrl(u) { u = String(u||'').trim(); return /^https?:\/\//i.test(u) ? esc(u) : ''; }
// Normaliza para comparar ignorando acentos/mayusculas.
function norm(s) { return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }

function canonSector(s) { var n = norm(s); for (var i=0;i<SECTORES.length;i++) if (norm(SECTORES[i])===n) return SECTORES[i]; return s ? SECTOR_OTRO : SECTOR_OTRO; }
function canonJur(j) { var n = norm(j); for (var i=0;i<JUR_ORDER.length;i++) if (norm(JUR_ORDER[i])===n) return JUR_ORDER[i]; return j ? JUR_OTRA : JUR_OTRA; }

// Limpia/normaliza una lista de proyectos al cargarla.
function normalizeProjects(list) {
  return (list||[]).map(function(p){
    p.id = (p.id==null) ? newId() : String(p.id);
    p.sector = canonSector(p.sector);
    p.jur = canonJur(p.jur);
    if (!p.fecha) p.fecha = '';
    return p;
  });
}

function mapTema(title, resumen) {
  var txt = norm((title||'') + ' ' + (resumen||''));
  for (var i = 0; i < TEMAS.length; i++) { for (var j = 0; j < TEMAS[i].keys.length; j++) { if (txt.indexOf(norm(TEMAS[i].keys[j])) >= 0) return TEMAS[i].tema; } }
  return 'Otro';
}
// Tema a mostrar: prioriza el que generó la skill (libre); cae al detector por keywords.
// Devuelve '' si no hay tema real (no mostramos el chip "Otro").
function temaOf(p) {
  var t = (p.tema && String(p.tema).trim()) || mapTema(p.title, p.resumen);
  return (!t || t === 'Otro') ? '' : t;
}
function mapOrg(org) {
  var l = (org||'').toLowerCase();
  if (l.indexOf('diputados') >= 0 && l.indexOf('naci') >= 0) return 'Camara de Diputados Nacional';
  if ((l.indexOf('senadores') >= 0 || l.indexOf('senado') >= 0) && l.indexOf('naci') >= 0) return 'Camara de Senadores Nacional';
  if (l.indexOf('legislatura') >= 0) return 'Legislatura Provincial';
  if (l.indexOf('diputados') >= 0) return 'Camara de Diputados Provincial';
  return org||'';
}

/* ============================================================
   NAV / RUTEO
   ============================================================ */
function navFecha() {
  return '<span class="nav-fecha">' + new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}) + '</span>';
}

function buildNav() {
  var tabs = document.getElementById('nav-tabs');
  var right = document.getElementById('nav-right');
  if (!currentUser) { tabs.innerHTML = ''; if (right) right.innerHTML = navFecha(); return; }
  var isAdmin = isResearch(currentUser);
  var h;
  if (isAdmin) {
    // Secuencia temporal del flujo admin: cargar -> revisar -> consolidar.
    var steps = [['adm','Cargar proyectos'],['mgr','Proyectos cargados'],['consolidado','Consolidado']];
    h = '';
    steps.forEach(function(s, i){
      if (i) h += '<span class="nav-chev"><i class="ti ti-chevron-right"></i></span>';
      h += '<div class="nav-tab'+(s[0]==='adm'?' active':'')+'" id="tab-'+s[0]+'" onclick="switchTab(\''+s[0]+'\')"><span class="step-n">'+(i+1)+'</span> '+s[1]+'</div>';
    });
  } else {
    h = '<div class="nav-tab active" id="tab-mgr" onclick="switchTab(\'mgr\')"><i class="ti ti-layout-list"></i> Proyectos cargados</div>';
  }
  tabs.innerHTML = h;
  if (right) right.innerHTML = navFecha()
    + '<span class="nav-user"><i class="ti ti-user-circle"></i>' + esc(currentUser) + '</span>'
    + '<button class="nav-logout" onclick="logout()">Salir</button>';
}

function switchTab(t) { document.querySelectorAll('.nav-tab').forEach(function(el){el.classList.remove('active');}); var el = document.getElementById('tab-'+t); if (el) el.classList.add('active'); renderApp(t); }

  h += '<div class="login-title">Smart Snippet</div>';
  h += '<div class="login-sub">Ingresá la contraseña del equipo para continuar</div>';

function doGate() {
  var pw = (document.getElementById('gate-pw').value || '').trim();

function teamLogout() { setGatePassed(false); renderGate(); }

async function login(name) {
  currentUser = name; viewDate = isoToday(); localSel = {}; localImp = {};
  showOverlay('Cargando proyectos...');
  try {
    PROJECTS = await dbGetProjects(viewDate);
    SELS = await dbGetSelections(viewDate);
  } catch(e) { hideOverlay(); alert('No se pudieron cargar los datos: ' + e.message); return; }
  loadLocalFromSels();
  hideOverlay(); buildNav(); switchTab(isResearch(currentUser) ? 'adm' : 'mgr');
}
function loadLocalFromSels() {
  localSel = {}; localImp = {};
  if (SELS[currentUser]) { Object.keys(SELS[currentUser]).forEach(function(pid){ localSel[pid] = true; localImp[pid] = SELS[currentUser][pid].impacts || {}; }); }
}
function logout() { currentUser=null; localSel={}; localImp={}; PROJECTS=[]; SELS={}; buildNav(); renderLogin(); }
function renderApp(tab) { var app=document.getElementById('app'); if(tab==='mgr')renderManager(app); else if(tab==='consolidado')renderConsolidado(app); else if(tab==='adm')renderAdmin(app); }

function getActiveSectors() { return Array.from(document.querySelectorAll('.sec-chk:checked')).map(function(c){return c.value;}); }
function getActiveJurs() { return Array.from(document.querySelectorAll('.jur-chk:checked')).map(function(c){return c.value;}); }
function allSecSelected() { return getActiveSectors().length === document.querySelectorAll('.sec-chk').length; }
function updateSecBtn() { var a=getActiveSectors(),all=document.querySelectorAll('.sec-chk').length,btn=document.getElementById('dd-sec-btn'),ac=document.getElementById('chk-all-sec'); if(!btn)return; if(!a.length){btn.textContent='Ninguno';ac.checked=false;ac.indeterminate=false;} else if(a.length===all){btn.textContent='Todos';ac.checked=true;ac.indeterminate=false;} else{btn.textContent=a.length+' sectores';ac.checked=false;ac.indeterminate=true;} }
function updateJurBtn() { var a=getActiveJurs(),total=document.querySelectorAll('.jur-chk').length,btn=document.getElementById('dd-jur-btn'),ac=document.getElementById('chk-all-jur'); if(!btn)return; if(!a.length){btn.textContent='Ninguna';ac.checked=false;ac.indeterminate=false;} else if(a.length===total){btn.textContent='Todas';ac.checked=true;ac.indeterminate=false;} else if(a.length===1){btn.textContent=a[0];ac.checked=false;ac.indeterminate=true;} else{btn.textContent=a.length+' jurisdicciones';ac.checked=false;ac.indeterminate=true;} var pa=document.querySelectorAll('.prov-chk:checked').length,pt=document.querySelectorAll('.prov-chk').length,pac=document.getElementById('chk-all-prov'); if(pac){pac.checked=pa===pt;pac.indeterminate=pa>0&&pa<pt;} }
function toggleMenu(type,e) { e.stopPropagation(); var id='dd-'+type+'-menu',other=type==='sec'?'dd-jur-menu':'dd-sec-menu'; document.getElementById(other).classList.remove('open'); document.getElementById(id).classList.toggle('open'); }
function toggleSec(val,e) { e.stopPropagation(); var chk=Array.from(document.querySelectorAll('.sec-chk')).find(function(c){return c.value===val;}); if(e.target!==chk)chk.checked=!chk.checked; updateSecBtn(); renderList(); }
function toggleJur(val,e) { e.stopPropagation(); var chk=Array.from(document.querySelectorAll('.jur-chk')).find(function(c){return c.value===val;}); if(e.target!==chk)chk.checked=!chk.checked; updateJurBtn(); renderList(); }
function toggleAllSec(e) { e.stopPropagation(); var a=document.getElementById('chk-all-sec'); if(e.target!==a)a.checked=!a.checked; document.querySelectorAll('.sec-chk').forEach(function(c){c.checked=a.checked;}); updateSecBtn(); renderList(); }
function toggleAllJur(e) { e.stopPropagation(); var a=document.getElementById('chk-all-jur'); if(e.target!==a)a.checked=!a.checked; document.querySelectorAll('.jur-chk').forEach(function(c){c.checked=a.checked;}); document.getElementById('chk-all-prov').checked=a.checked; updateJurBtn(); renderList(); }
function toggleAllProv(e) { e.stopPropagation(); var a=document.getElementById('chk-all-prov'); if(e.target!==a)a.checked=!a.checked; document.querySelectorAll('.prov-chk').forEach(function(c){c.checked=a.checked;}); updateJurBtn(); renderList(); }
document.addEventListener('click', function(){ var sm=document.getElementById('dd-sec-menu'),jm=document.getElementById('dd-jur-menu'); if(sm)sm.classList.remove('open'); if(jm)jm.classList.remove('open'); });

function initImp(id) { id=String(id); if (!localImp[id]) { localImp[id]={}; CLIENTS.forEach(function(c){localImp[id][c]='-';}); } }

function getOtherImpacts(pid) {
  pid = String(pid);
  var results = [];
  Object.keys(SELS).forEach(function(mname) {
    if (mname === currentUser) return;
    var sel = SELS[mname];
    if (!sel[pid]) return;
    var imp = sel[pid].impacts || {};
    CLIENTS.forEach(function(c) { if (imp[c] && imp[c] !== '-') results.push({name: mname, client: c, level: imp[c]}); });
  });
  return results;
}

function impactBadgeStyle(level) {
  if (level === 'Alto') return 'background:#C0392B;color:#fff;';
  if (level === 'Medio') return 'background:#E67E22;color:#fff;';
  if (level === 'Bajo') return 'background:#F9E4A0;color:#7A5C00;';
  return 'background:#eee;color:#555;';
}

function cardHTML(p) {
  var id = String(p.id);
  var isSel = !!localSel[id];
  if (isSel) initImp(id);
  var tema = temaOf(p);
  var otherImps = getOtherImpacts(id);
  var lx = safeUrl(p.linkExpediente), lt = safeUrl(p.linkTexto);

  var h = '<div class="card'+(isSel?' sel':'')+'" onclick="toggleCard(\''+id+'\',event)">';
  h += '<div class="chk">'+(isSel?'<i class="ti ti-check" style="font-size:12px;color:#fff"></i>':'')+'</div>';

  // MITAD IZQUIERDA: info del proyecto
  h += '<div class="cinfo">';
  h += '<div class="ctitle">'+esc(p.title)+'</div>';
  if (isSel) {
    // EXPANDIDA: todo el detalle
    h += '<div class="cmeta"><span class="pill p-fecha"><i class="ti ti-calendar" style="font-size:10px"></i> '+esc(p.fecha)+'</span>';
    h += '<span class="pill p-num">'+esc(p.num)+'</span>';
    if (tema) h += '<span class="pill p-tema">'+esc(tema)+'</span>';
    h += '<span class="pill p-org">'+esc(mapOrg(p.org))+'</span>';
    if (lx) h += '<a href="'+lx+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="clink"><i class="ti ti-link" style="font-size:11px"></i> Expediente</a>';
    if (lt) h += '<a href="'+lt+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="clink"><i class="ti ti-file-text" style="font-size:11px"></i> Texto</a>';
    h += '</div>';
    h += '<div class="cresumen">El proyecto de ley tiene por objeto '+esc(p.resumen||'')+'</div>';
  } else {
    // COLAPSADA (hipercolapsada): solo título + tema
    h += '<div class="cmeta-min">';
    if (tema) h += '<span class="pill p-tema">'+esc(tema)+'</span>';
    if (otherImps.length) h += '<span class="others-mark" title="'+otherImps.length+' calificación(es) de otros managers"><i class="ti ti-users" style="font-size:11px"></i> '+otherImps.length+'</span>';
    h += '</div>';
  }
  h += '</div>'; // cinfo

  // MITAD DERECHA: solo al expandir (impacto). Colapsada: chevron sutil.
  if (isSel) {
    h += '<div class="cimpact wide" onclick="event.stopPropagation()">';
    if (otherImps.length) {
      h += '<div class="other-imps"><div class="other-imps-t">Impactos de otros</div>';
      otherImps.forEach(function(x) {
        h += '<div class="other-imp-row"><span class="other-imp-badge" style="'+impactBadgeStyle(x.level)+'">'+esc(x.level)+'</span>';
        h += '<span class="other-imp-name" title="'+esc(x.name+' - '+x.client)+'">'+esc(x.name.split(' ')[0]+' · '+x.client)+'</span></div>';
      });
      h += '</div>';
    }
    h += renderImp(id);
    h += '</div>';
  } else {
    h += '<i class="ti ti-chevron-down card-chev"></i>';
  }
  h += '</div>';
  return h;
}

function renderImp(pid) {
  pid = String(pid); initImp(pid);
  var imp = localImp[pid];
  var h = '<div class="impacts-section" onclick="event.stopPropagation()"><div class="impacts-title">Impacto por cliente</div><div class="impacts-grid">';
  CLIENTS.forEach(function(c) {
    var v = imp[c]||'-'; var cls = v==='Alto'?'alto':v==='Medio'?'medio':v==='Bajo'?'bajo':'';
    var cj = c.replace(/'/g,"\\'");
    h += '<div class="imp-item"><span class="imp-label" title="'+esc(c)+'">'+esc(c)+'</span><select class="imp-select '+cls+'" onchange="setImp(\''+pid+'\',\''+cj+'\',this.value);colorSel(this)">';
    IMPACT.forEach(function(o){ h += '<option'+(v===o?' selected':'')+'>'+o+'</option>'; });
    h += '</select></div>';
  });
  h += '</div></div>'; return h;
}

function colorSel(el) { el.className = 'imp-select '+(el.value==='Alto'?'alto':el.value==='Medio'?'medio':el.value==='Bajo'?'bajo':''); }
function setImp(pid,client,val) { pid=String(pid); initImp(pid); localImp[pid][client]=val; }

function renderList() {
  var aS=getActiveSectors(),aJ=getActiveJurs();
  var f = PROJECTS.filter(function(p){return aS.indexOf(p.sector)>=0 && aJ.indexOf(p.jur)>=0;});
  var list = document.getElementById('list'); if (!list) return;
  if (!PROJECTS.length) { list.innerHTML='<div class="empty"><i class="ti ti-inbox" style="font-size:28px;display:block;margin:0 auto 10px"></i>No hay proyectos cargados para este día.</div>'; return; }
  if (!f.length) { list.innerHTML='<div class="empty"><i class="ti ti-filter-off" style="font-size:28px;display:block;margin:0 auto 10px"></i>No hay proyectos con esos filtros</div>'; return; }

  var groups = {}, groupOrder = [];
  f.forEach(function(p) { var fecha = p.fecha || 'Sin fecha'; if (!groups[fecha]) { groups[fecha] = []; groupOrder.push(fecha); } groups[fecha].push(p); });
  groupOrder.sort(function(a,b){ return fechaSortKey(b).localeCompare(fechaSortKey(a)); });

  var DIAS_ES = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function fechaLabel(fecha) {
    if (fecha === 'Sin fecha') return 'Sin fecha';
    var parts = fecha.split('/'); if (parts.length !== 3) return fecha;
    var d = parseInt(parts[0]), m = parseInt(parts[1])-1, y = parseInt(parts[2]);
    var date = new Date(y, m, d); var diaNom = DIAS_ES[date.getDay()]; var mesNom = MESES[m];
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.round((today - date) / 86400000);
    var extra = diff === 0 ? ' — Hoy' : diff === 1 ? ' — Ayer' : '';
    return diaNom + ' ' + d + ' de ' + mesNom + ' de ' + y + extra;
  }

  // Orden de sectores y jurisdicciones incluyendo los buckets de fallback.
  var SEC_ORDER = SECTORES.concat([SECTOR_OTRO]);
  var JUR_FULL = JUR_ORDER.concat([JUR_OTRA]);

  var h = '';
  groupOrder.forEach(function(fecha) {
    var ps = groups[fecha];
    h += '<div style="margin-bottom:1.5rem">';
    h += '<div style="font-size:14px;font-weight:600;color:var(--text);padding:10px 0 8px;border-bottom:2px solid var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:8px">';
    h += '<i class="ti ti-calendar" style="color:var(--blue);font-size:16px"></i>'+esc(fechaLabel(fecha));
    h += '<span style="font-size:11px;font-weight:400;color:var(--text3);margin-left:4px">('+ps.length+' proyecto'+(ps.length!==1?'s':'')+')</span></div>';
    if (allSecSelected()) {
      SEC_ORDER.forEach(function(sec) {
        var sp = ps.filter(function(p){return p.sector===sec;}); if (!sp.length) return;
        h += '<div class="group-sector-title" style="margin-top:8px">'+esc(sec)+'</div>';
        JUR_FULL.forEach(function(jur){ var jp=sp.filter(function(p){return p.jur===jur;}); if(!jp.length)return; h+='<div class="group-jur-title">'+esc(jur)+'</div><div class="group-jur-cards">'+jp.map(cardHTML).join('')+'</div>'; });
      });
    } else {
      h += ps.map(cardHTML).join('');
    }
    h += '</div>';
  });
  list.innerHTML = h;
}

function toggleCard(id,e) { id=String(id); if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return; if(localSel[id]){delete localSel[id];delete localImp[id];}else{localSel[id]=true;initImp(id);} renderList(); updateFinfo(); }
function updateFinfo() { var n=Object.keys(localSel).length; var fi=document.getElementById('finfo'); if(fi)fi.textContent=n?n+' proyecto(s) listo(s) para guardar':'Selecciona proyectos para guardar'; }

async function changeDate(iso) {
  if (!iso) return;
  viewDate = iso;
  showOverlay('Cargando...');
  try { PROJECTS = await dbGetProjects(iso); SELS = await dbGetSelections(iso); }
  catch(e) { hideOverlay(); return; }
  loadLocalFromSels();
  hideOverlay();

}

async function submitSelection() {
  var n=Object.keys(localSel).length; var s=document.getElementById('submit-status');
  if(!n){if(s)s.innerHTML='<div class="alert info">Selecciona al menos un proyecto.</div>';return;}
  showOverlay('Guardando seleccion...');
  var sd={}; Object.keys(localSel).forEach(function(pid){sd[pid]={impacts:localImp[pid]||{},ts:Date.now()};});
  try { await dbSaveSelection(viewDate,currentUser,sd); SELS[currentUser]=sd; hideOverlay(); if(s)s.innerHTML='<div class="alert success"><i class="ti ti-check"></i> Selección guardada — '+n+' proyecto(s).</div>'; }

/* ============================================================
   VISTA CONSOLIDADO (admin) — por día
   ============================================================ */
async function renderConsolidado(container) {
  showOverlay('Cargando consolidado...');
  try { PROJECTS = await dbGetProjects(viewDate); } catch(e) { PROJECTS = []; }
  try { SELS = await dbGetSelections(viewDate); } catch(e) { SELS = {}; }
  hideOverlay();
  var mns=Object.keys(SELS);
  var selPids={}; mns.forEach(function(m){Object.keys(SELS[m]).forEach(function(pid){selPids[String(pid)]=true;});});

  var h='<div class="admin-body">';
  h+='<div class="m-date" style="justify-content:flex-end;margin-bottom:12px"><label for="cons-date">Día</label><input type="date" id="cons-date" value="'+viewDate+'" max="'+isoToday()+'" onchange="consolidadoChangeDate(this.value)"></div>';
  h+='<div class="admin-card">';
  h+='<div class="admin-card-title"><i class="ti ti-table"></i> Panel consolidado <span style="background:var(--blue-bg);color:var(--blue-dark);font-size:12px;padding:2px 10px;border-radius:var(--radius);font-weight:500;margin-left:4px">'+mns.length+' manager(s)</span></div>';
  h+='<div class="admin-card-sub">Selecciones guardadas para el '+esc(isoToDisplay(viewDate))+'.</div>';
  h+='<button class="btn" style="font-size:12px;padding:5px 10px;margin-bottom:1rem" onclick="renderConsolidado(document.getElementById(\'app\'))"><i class="ti ti-refresh"></i> Actualizar</button>';
  if(!mns.length){h+='<div class="empty" style="padding:1.5rem"><i class="ti ti-clock" style="font-size:28px;display:block;margin:0 auto 10px"></i>Ningun manager ha enviado su seleccion para este día.</div>';}
  else{mns.forEach(function(m){h+=managerCard(m,SELS[m],PROJECTS);});}
  h+='</div>';
  if(sp.length){
    h+='<div class="admin-card"><div class="admin-card-title"><i class="ti ti-copy"></i> Copiar a Sheets</div>';
    h+='<div class="admin-card-sub">Impacto mas alto entre managers como definitivo.</div>';
    h+='<div class="btn-row"><button class="btn primary" onclick="copyConsolidado()"><i class="ti ti-copy"></i> Copiar todo para Sheets</button>';
    h+='<span id="copy-ok" style="font-size:12px;color:var(--green);display:none"><i class="ti ti-check"></i> Copiado!</span></div>';
    h+='<div class="cprev">'+esc(buildRows(sp,SELS).split('\n').map(function(r){return r.split('\t').slice(0,6).join(' | ')+' | ...';}).join('\n'))+'</div></div>';
  }
  h+='</div>'; container.innerHTML=h;
}

async function consolidadoChangeDate(iso) { if(!iso)return; viewDate=iso; await renderConsolidado(document.getElementById('app')); }

function managerCard(name,sel,projects) {
  var ps=projects.filter(function(p){return sel[String(p.id)];});
  var h='<div class="mgr-card"><div class="mgr-hdr"><i class="ti ti-user" style="color:var(--blue);font-size:16px"></i>';
  h+='<span class="mgr-name">'+esc(name)+'</span><span class="mgr-count">'+ps.length+' proyecto(s)</span>';
  h+='<button class="mgr-clear" onclick="clearMgrSel(\''+name.replace(/'/g,"\\'")+'\')"><i class="ti ti-trash"></i></button></div><div class="mgr-projs">';
  ps.forEach(function(p){ var imp=(sel[String(p.id)]&&sel[String(p.id)].impacts)||{}; var nd=Object.entries(imp).filter(function(x){return x[1]&&x[1]!=='-';}); h+='<div class="mgr-proj"><span class="mgr-pnum">'+esc(p.num)+'</span><span class="mgr-ptitle">'+esc(p.title)+'</span><div class="mgr-imps">'+nd.map(function(x){return'<span class="mgr-imp '+esc(String(x[1]).toLowerCase())+'">'+esc(x[0]+': '+x[1])+'</span>';}).join('')+'</div></div>'; });
  h+='</div></div>'; return h;
}

async function clearMgrSel(name) {
  if(!confirm('Eliminar la seleccion de '+name+'?'))return;
  showOverlay('Eliminando...');
  try{await sbFetch('selections?date=eq.'+viewDate+'&manager=eq.'+encodeURIComponent(name),'DELETE');delete SELS[name];}catch(e){}
  hideOverlay(); renderConsolidado(document.getElementById('app'));
}

function mergeImpacts(pids,sels) {
  var order={'-':0,'N/A':1,'Bajo':2,'Medio':3,'Alto':4}; var merged={};
  pids.forEach(function(pid){ pid=String(pid); merged[pid]={}; CLIENTS.forEach(function(c){ var best='-'; Object.values(sels).forEach(function(sel){var v=(sel[pid]&&sel[pid].impacts&&sel[pid].impacts[c])||'-';if((order[v]||0)>(order[best]||0))best=v;}); merged[pid][c]=best; }); });
  return merged;
}

function buildRows(projects,sels) {
  var hoy=todayStr(); var merged=mergeImpacts(projects.map(function(p){return String(p.id);}),sels);
  return projects.map(function(p){
    var imp=merged[String(p.id)]||{}; var ca=CLIENTS.filter(function(c){return imp[c]&&imp[c]!=='-';}).join(', ')||'';
    var cols=[p.num,p.linkExpediente||'',p.fecha,hoy,'Argentina',p.jur,p.autor||'',p.sector,ca,temaOf(p),(p.title||'').toUpperCase(),'El proyecto de ley tiene por objeto '+(p.resumen||''),p.linkTexto||'',mapOrg(p.org),'','','',p.fecha].concat(CLIENTS.map(function(c){return imp[c]||'-';}));
    return cols.join('\t');
  }).join('\n');
}

function copyConsolidado() {
  var selPids={}; Object.values(SELS).forEach(function(sel){Object.keys(sel).forEach(function(pid){selPids[String(pid)]=true;});});
  var sp=PROJECTS.filter(function(p){return selPids[String(p.id)];}); if(!sp.length)return;
  var rows=buildRows(sp,SELS);
  var showOk=function(){var ok=document.getElementById('copy-ok');if(ok){ok.style.display='inline';setTimeout(function(){ok.style.display='none';},2200);}};
  try{navigator.clipboard.writeText(rows).then(showOk).catch(function(){fallbackCopy(rows,showOk);});}catch(e){fallbackCopy(rows,showOk);}
}

function fallbackCopy(text,cb) {
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');if(cb)cb();}catch(e){alert('Copia manual: Ctrl+A, Ctrl+C en el preview');}
  document.body.removeChild(ta);
}

var adminDate = '';

async function renderAdmin(container) {
  if (!adminDate) adminDate = isoToday();
  showOverlay('Cargando...');
  try { PROJECTS = await dbGetProjects(adminDate); } catch(e) { PROJECTS = []; }
  hideOverlay();
  var dayProjects = PROJECTS;
  var h='<div class="admin-body">';
  h+='<div class="m-date" style="justify-content:flex-end;margin-bottom:12px"><label for="adm-date">Día a cargar</label><input type="date" id="adm-date" value="'+adminDate+'" onchange="adminChangeDate(this.value)"></div>';

  // ---- Importar JSON (generado con Claude) ----
  h+='<div class="admin-card"><div class="admin-card-title"><i class="ti ti-clipboard-text"></i> Importar proyectos (JSON)</div>';
  h+='<div class="admin-card-sub">Pegá el newsletter en Claude con el prompt de abajo, copiá el JSON que devuelve y pegalo acá. Se cargan para el día seleccionado arriba.</div>';
  h+='<div class="btn-row" style="margin-bottom:10px"><button class="btn" onclick="copyPrompt()"><i class="ti ti-prompt"></i> Copiar prompt para Claude</button><span id="prompt-ok" style="font-size:12px;color:var(--green);display:none"><i class="ti ti-check"></i> Copiado!</span></div>';
  h+='<div class="field-grid full"><div class="field"><label>JSON de proyectos</label><textarea id="json-text" style="min-height:160px;font-size:12px;font-family:monospace" placeholder=\'[{"num":"1234-D-2026","sector":"Tecnologia","jur":"Nacional",...}]\'></textarea></div></div>';
  h+='<div id="json-alert"></div>';
  h+='<div class="btn-row" style="margin-top:12px"><button class="btn primary" onclick="importJson()"><i class="ti ti-download"></i> Importar JSON</button></div></div>';

  // ---- Alta manual ----
  h+='<div class="admin-card"><div class="admin-card-title"><i class="ti ti-circle-plus"></i> Agregar proyecto manualmente</div>';
  h+='<div class="field-grid"><div class="field"><label>Numero *</label><input id="f-num" placeholder="ej. 1234-D-2026"></div>';
  h+='<div class="field"><label>Fecha</label><input id="f-fecha" type="date" value="'+adminDate+'"></div></div>';
  h+='<div class="field-grid"><div class="field"><label>Sector *</label><select id="f-sector"><option value="">Selecciona</option>'+SECTORES.map(function(s){return'<option>'+esc(s)+'</option>';}).join('')+'</select></div>';
  h+='<div class="field"><label>Jurisdiccion *</label><select id="f-jur"><option value="">Selecciona</option><option>Nacional</option><optgroup label="Provincial">'+PROVINCIAS.map(function(p){return'<option>'+esc(p)+'</option>';}).join('')+'</optgroup><option>Municipal</option></select></div></div>';
  h+='<div class="field-grid full"><div class="field"><label>Organismo *</label><input id="f-org"></div></div>';
  h+='<div class="field-grid full"><div class="field"><label>Autor/es</label><input id="f-autor"></div></div>';
  h+='<div class="field-grid full"><div class="field"><label>Titulo *</label><input id="f-title"></div></div>';
  h+='<div class="field-grid full"><div class="field"><label>Resumen (sin "tiene por objeto") *</label><textarea id="f-resumen"></textarea></div></div>';
  h+='<div class="field-grid"><div class="field"><label>Link expediente</label><input id="f-link-exp"></div><div class="field"><label>Link PDF</label><input id="f-link-pdf"></div></div>';
  h+='<div id="form-alert"></div><div class="btn-row" style="margin-top:12px"><button class="btn primary" onclick="addProject()"><i class="ti ti-plus"></i> Agregar</button></div></div>';

  // ---- Lista del día ----
  h+='<div class="admin-card"><div class="admin-card-title"><i class="ti ti-list"></i> Proyectos del '+esc(isoToDisplay(adminDate))+' <span style="background:var(--blue-bg);color:var(--blue-dark);font-size:12px;padding:2px 10px;border-radius:var(--radius);font-weight:500;margin-left:4px">'+dayProjects.length+'</span></div>';
  h+='<div class="btn-row" style="margin-bottom:10px"><button class="btn danger" onclick="clearDayProjects()"><i class="ti ti-trash"></i> Limpiar este día</button></div><div id="proj-list">';
  if(dayProjects.length){dayProjects.forEach(function(p){h+='<div class="pi-row"><span class="pi-num">'+esc(p.num)+'</span><span class="pi-title">'+esc(p.title)+'</span><span class="pi-jur">'+esc(p.jur+' - '+p.sector)+'</span><button class="pi-del" onclick="deleteProject(\''+String(p.id)+'\')"><i class="ti ti-trash"></i></button></div>';});}
  else{h+='<div style="font-size:13px;color:var(--text3);padding:8px 0">No hay proyectos cargados para este día.</div>';}

async function adminChangeDate(iso) { if(!iso)return; adminDate=iso; await renderAdmin(document.getElementById('app')); }

function extractionPrompt() {
  return 'Sos un asistente especializado en analisis de textos legislativos argentinos. Analiza el Daily Legal Snippet que te paso y extrae TODOS los proyectos de ley.\n\n'
    + 'Para cada proyecto extrae estos campos:\n'
    + '- num: numero de expediente (ej. 1234-D-2026)\n'
    + '- sector: EXACTAMENTE uno de: ' + SECTORES.join(', ') + '\n'
    + '- jur: EXACTAMENTE uno de: ' + JUR_ORDER.join(', ') + '\n'
    + '- org: nombre del organismo\n'
    + '- autor: autor/es\n'
    + '- title: titulo descriptivo (max 150 caracteres)\n'
    + '- resumen: objeto del proyecto, SIN "tiene por objeto" al inicio\n'
    + '- linkExpediente: URL del expediente si aparece (si no, "")\n'
    + '- linkTexto: URL del PDF si aparece (si no, "")\n'
    + '- fecha: en formato DD/MM/YYYY\n\n'
    + 'Respondé UNICAMENTE con un array JSON válido (un objeto por proyecto), sin markdown ni explicaciones.\n\n'
    + 'TEXTO DEL SNIPPET:\n[PEGÁ ACÁ EL CONTENIDO DEL NEWSLETTER]';
}

function copyPrompt() {
  var txt = extractionPrompt();
  var ok=function(){var e=document.getElementById('prompt-ok');if(e){e.style.display='inline';setTimeout(function(){e.style.display='none';},2200);}};
  try{navigator.clipboard.writeText(txt).then(ok).catch(function(){fallbackCopy(txt,ok);});}catch(e){fallbackCopy(txt,ok);}
}

function importJson() {
  var alertEl=document.getElementById('json-alert');
  var raw=(document.getElementById('json-text').value||'').trim();
  if(!raw){alertEl.innerHTML='<div class="alert error">Pegá el JSON primero.</div>';return;}
  raw=raw.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  var arr;
  try { arr=JSON.parse(raw); } catch(e){ alertEl.innerHTML='<div class="alert error">El JSON no es válido: '+esc(e.message)+'</div>'; return; }
  if(!Array.isArray(arr)){ if(arr&&Array.isArray(arr.proyectos))arr=arr.proyectos; else { alertEl.innerHTML='<div class="alert error">Esperaba un array JSON de proyectos.</div>'; return; } }
  var clean=[], skipped=0;
  arr.forEach(function(o){
    if(!o||typeof o!=='object'){skipped++;return;}
    var num=String(o.num||'').trim(), title=String(o.title||'').trim(), resumen=String(o.resumen||'').trim();
    if(!num && !title){skipped++;return;}
    clean.push({
      id:newId(), num:num||'(sin número)', title:title||'(sin título)', resumen:resumen,
      sector:canonSector(o.sector), jur:canonJur(o.jur), tema:String(o.tema||'').trim(),
      org:String(o.org||'').trim(), autor:String(o.autor||'').trim(),
      linkExpediente:String(o.linkExpediente||o.linkExp||'').trim(),
      linkTexto:String(o.linkTexto||o.linkPdf||'').trim(),
      fecha:String(o.fecha||isoToDisplay(adminDate)).trim()
    });
  });
  if(!clean.length){ alertEl.innerHTML='<div class="alert error">No se pudo extraer ningún proyecto del JSON.</div>'; return; }
  showOverlay('Importando...');
  saveDay(adminDate, PROJECTS.concat(clean)).then(function(){
    hideOverlay();
    alertEl.innerHTML='<div class="alert success"><i class="ti ti-check"></i> '+clean.length+' proyecto(s) importados'+(skipped?(' ('+skipped+' descartados por datos incompletos)'):'')+' para el '+esc(isoToDisplay(adminDate))+'.</div>';
    document.getElementById('json-text').value='';
    setTimeout(function(){renderAdmin(document.getElementById('app'));},1400);
  }).catch(function(e){ hideOverlay(); alertEl.innerHTML='<div class="alert error">Error al guardar: '+esc(e.message)+'</div>'; });
}

// Guarda la lista completa de UN día (helper con manejo de error real).
async function saveDay(iso, list) { await dbSaveProjects(iso, list); PROJECTS = list; }

async function addProject() {
  var num=document.getElementById('f-num').value.trim(),fechaRaw=document.getElementById('f-fecha').value||adminDate,sector=document.getElementById('f-sector').value,jur=document.getElementById('f-jur').value,org=document.getElementById('f-org').value.trim(),autor=document.getElementById('f-autor').value.trim(),title=document.getElementById('f-title').value.trim(),resumen=document.getElementById('f-resumen').value.trim(),linkExpediente=document.getElementById('f-link-exp').value.trim(),linkTexto=document.getElementById('f-link-pdf').value.trim();
  var errs=[]; if(!num)errs.push('Numero');if(!sector)errs.push('Sector');if(!jur)errs.push('Jurisdiccion');if(!org)errs.push('Organismo');if(!title)errs.push('Titulo');if(!resumen)errs.push('Resumen');
  var alertEl=document.getElementById('form-alert');
  if(errs.length){alertEl.innerHTML='<div class="alert error">Completa: '+errs.join(', ')+'</div>';return;}
  // El alta usa la fecha del formulario; si difiere del día en pantalla, cargamos esa fecha.
  var targetIso = fechaRaw;
  showOverlay('Guardando...');
  try {
    var list = (targetIso === adminDate) ? PROJECTS.slice() : await dbGetProjects(targetIso);
    list.push({id:newId(),num:num,sector:canonSector(sector),jur:canonJur(jur),org:org,autor:autor,title:title,resumen:resumen,linkExpediente:linkExpediente,linkTexto:linkTexto,fecha:isoToDisplay(targetIso)});
    await dbSaveProjects(targetIso, list);
    if (targetIso === adminDate) PROJECTS = list;
    hideOverlay();
    alertEl.innerHTML='<div class="alert success"><i class="ti ti-check"></i> Proyecto agregado para el '+esc(isoToDisplay(targetIso))+'</div>';
    if (targetIso !== adminDate) adminDate = targetIso;
    setTimeout(function(){renderAdmin(document.getElementById('app'));},1200);
  } catch(e) { hideOverlay(); alertEl.innerHTML='<div class="alert error">Error: '+esc(e.message)+'</div>'; }
}

async function deleteProject(id) {
  if(!confirm('Eliminar este proyecto?'))return;
  id=String(id);
  showOverlay('Eliminando...');
  try { var list=PROJECTS.filter(function(p){return String(p.id)!==id;}); await dbSaveProjects(adminDate,list); PROJECTS=list; }
  catch(e){ hideOverlay(); alert('Error: '+e.message); return; }
  hideOverlay(); renderAdmin(document.getElementById('app'));
}

async function clearDayProjects() {
  if(!confirm('Eliminar TODOS los proyectos del '+isoToDisplay(adminDate)+'?'))return;
  showOverlay('Eliminando...');
  try { await dbSaveProjects(adminDate,[]); PROJECTS=[]; } catch(e){ hideOverlay(); alert('Error: '+e.message); return; }
  hideOverlay(); renderAdmin(document.getElementById('app'));
}
